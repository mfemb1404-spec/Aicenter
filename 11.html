body{font-family:var(--font);background:var(--bg);color:var(--t1);line-height:1.65;font-size:14px}

<script type="text/plain" id="gasTpl">
const SHEET_NAME = 'AI_Command_DB';
const CHUNK_SIZE = 40000;

function getSheet_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName(SHEET_NAME);
  if (!sh) { sh = ss.insertSheet(SHEET_NAME); sh.getRange('A1:C1').setValues([['DataChunk','UpdatedAt','LastAuthor']]); }
  return sh;
}
function doGet() {
  try {
    const sh = getSheet_(), lr = sh.getLastRow();
    if (lr < 2) return out_({ ok: true, empty: true, data: null });
    const raw = sh.getRange(2, 1, lr - 1, 1).getValues().map(r => r[0] || '').join('');
    return out_({ ok: true, empty: !raw, data: raw ? JSON.parse(raw) : null, updatedAt: sh.getRange('B2').getValue(), lastAuthor: sh.getRange('C2').getValue() });
  } catch (e) { return out_({ ok: false, error: e.message }); }
}
function doPost(e) {
  const lock = LockService.getScriptLock();
  try {
    lock.waitLock(15000);
    const body = JSON.parse(e.postData.contents);
    if (!body || !body.data) return out_({ ok: false, error: 'داده‌ای ارسال نشده است.' });
    const sh = getSheet_(), str = JSON.stringify(body.data), chunks = [];
    for (let i = 0; i < str.length; i += CHUNK_SIZE) chunks.push([str.slice(i, i + CHUNK_SIZE)]);
    if (sh.getLastRow() > 1) sh.getRange(2, 1, sh.getLastRow() - 1, 3).clearContent();
    if (chunks.length) sh.getRange(2, 1, chunks.length, 1).setValues(chunks);
    const now = new Date().toISOString();
    sh.getRange('B2').setValue(now); sh.getRange('C2').setValue(body.author || 'عضو تیم');
    return out_({ ok: true, updatedAt: now });
  } catch (err) { return out_({ ok: false, error: err.message }); } finally { lock.releaseLock(); }
}
function out_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }
</script>

<script>
(() => {
'use strict';
const KEY = 'ilm_ai_cmd_v2';
const $ = id => document.getElementById(id);
const uid = p => p + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
const now = () => new Date().toISOString();
const esc = s => s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const fDate = d => { if (!d) return '—'; try { return new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(d)); } catch { return d.slice(0,10); } };
const fDT = d => { if (!d) return '—'; try { return new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(d)); } catch { return d; } };

/* ---------- Merge & API Helpers ---------- */
const mergeArr = (loc=[], rem=[]) => {
  const m = new Map(); loc.forEach(x=>x?.id&&m.set(x.id,x));
  rem.forEach(x=>{ if(!x?.id) return; const o=m.get(x.id); if(!o || new Date(x.updatedAt||0)>=new Date(o.updatedAt||0)) m.set(x.id,x); });
  return [...m.values()];
};
const teamPayload = () => ({ stages:st.stages, prompts:st.prompts, notes:st.notes, tasks:st.tasks, workflows:st.workflows, resources:st.resources });
function mergeTeam(rem) {
  if (!rem) return;
  if (rem.stages?.length) { const sm = new Map(st.stages.map(s=>[s.id,s])); rem.stages.forEach(s=>sm.set(s.id,s)); st.stages=[...sm.values()]; }
  ['prompts','notes','tasks','workflows','resources'].forEach(k => st[k] = mergeArr(st[k], rem[k]||[]));
}

async function callAI(prompt, pur) {
  const a = st.api, t0 = performance.now();
  if (a.provider === 'gemini') {
    if (!a.geminiKey) throw new Error('کلید Gemini وارد نشده است.');
    const mod = (a.geminiCustom||'').trim() || a.geminiModel || 'gemini-2.5-flash';
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(mod)}:generateContent?key=${encodeURIComponent(a.geminiKey.trim())}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ contents:[{role:'user',parts:[{text:prompt}]}], generationConfig:{temperature:+a.temp||.3, topP:+a.topP||.9} })
    });
    const d = await r.json().catch(()=>({})); if (!r.ok) throw new Error(d.error?.message || 'HTTP '+r.status);
    const txt = d.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || '';
    const inT = d.usageMetadata?.promptTokenCount||0, outT = d.usageMetadata?.candidatesTokenCount||0, tot = d.usageMetadata?.totalTokenCount||(inT+outT);
    st.tokenLogs.push({ at:now(), pur, mod, inT, outT, tot }); save();
    return { txt, mod, tot, ms:Math.round(performance.now()-t0) };
  } else {
    if (!a.openaiKey) throw new Error('کلید OpenAI/OpenRouter وارد نشده است.');
    const base = (a.openaiBase||'https://openrouter.ai/api/v1').replace(/\/+$/,''), mod = (a.openaiModel||'gpt-4o-mini').trim();
    const r = await fetch(`${base}/chat/completions`, {
      method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+a.openaiKey.trim()},
      body:JSON.stringify({ model:mod, messages:[{role:'user',content:prompt}], temperature:+a.temp||.3, top_p:+a.topP||.9 })
    });
    const d = await r.json().catch(()=>({})); if (!r.ok) throw new Error(d.error?.message || 'HTTP '+r.status);
    const txt = d.choices?.[0]?.message?.content || '';
    const inT = d.usage?.prompt_tokens||0, outT = d.usage?.completion_tokens||0, tot = d.usage?.total_tokens||(inT+outT);
    st.tokenLogs.push({ at:now(), pur, mod, inT, outT, tot }); save();
    return { txt, mod, tot, ms:Math.round(performance.now()-t0) };
  }
}

    return `نقش: مهندس ارشد پرامپت و ویراستار متون علمی فارسی.\nمأموریت: با مقایسه «خروجی فعلی» و «خروجی مطلوب تیم»، ایرادات «پرامپت فعلی» را استخراج کن و پرامپت اصلاح‌شده را بنویس.\n\n=== ۱. پرامپت فعلی ===\n${l.cur||'—'}\n\n=== ۲. نمونه خروجی مطلوب تیم ===\n${l.ideal||'—'}\n\n=== ۳. خروجی فعلی هوش مصنوعی ===\n${l.ai||'—'}\n${l.hint?`\n=== تمرکز ویژه ===\n${l.hint}\n`:''}\nپاسخ را در ۳ بخش بده:\n۱) تحلیل دقیق تفاوت‌ها و ایرادات پرامپت فعلی\n۲) پرامپت اصلاح‌شده کامل ${forApi?'(دقیقاً بین <<<START>>> و <<<END>>> قرار بده)':'(در یک کادر مشخص و آماده کپی)'}\n۳) پیشنهاد تنظیمات Temperature و نکته برای تست بعدی.`;
  },

      save(); render(); this.toast(`تحلیل کامل شد (${r.ms}ms | ${r.tot} توکن)`,'ok');

      <div class="fg"><label>متن و نکات آموزشی *</label><textarea id="rS" class="ta" rows="5">${esc(d.summary)}</textarea></div>
      <div class="fg2">
        <div class="fg"><label>ارجاع به پرامپت‌ها</label><div class="chkbox" style="max-height:110px;overflow:auto">${st.prompts.map(p=>`<label class="chk"><input type="checkbox" class="rPC" value="${p.id}" ${(d.linkedPromptIds||[]).includes(p.id)?'checked':''}><span>${esc(p.title)}</span></label>`).join('')}</div></div>
        <div class="fg"><label>ارجاع به تجربیات</label><div class="chkbox" style="max-height:110px;overflow:auto">${st.notes.map(n=>`<label class="chk"><input type="checkbox" class="rNC" value="${n.id}" ${(d.linkedNoteIds||[]).includes(n.id)?'checked':''}><span>${esc(n.title)}</span></label>`).join('')}</div></div>
      </div>`,
      `<button class="btn" onclick="App.closeM()">انصراف</button><button class="btn btn-p" onclick="App.saveR('${id||''}')">💾 ذخیره</button>`, true);
  },
  saveR(id) {
    const title=$('rT').value.trim(), summary=$('rS').value.trim(); if(!title||!summary) return this.toast('عنوان و متن الزامی است','er');
    const o={ title, category:$('rC').value, driveUrl:$('rD').value.trim(), summary, linkedPromptIds:[...document.querySelectorAll('.rPC:checked')].map(x=>x.value), linkedNoteIds:[...document.querySelectorAll('.rNC:checked')].map(x=>x.value), isSample:false, updatedAt:now() };
    if(id) Object.assign(st.resources.find(x=>x.id===id), o); else st.resources.unshift({id:uid('r'),...o});
    save(); this.closeM(); render(); this.toast('منبع ذخیره شد','ok');
  },
  delR(id) { if(confirm('حذف شود؟')) { st.resources=st.resources.filter(x=>x.id!==id); save(); render(); } },

  /* API & Sync & Backup */
  apiSet(k,v,rr) { st.api[k]=v; save(); if(rr) render(); },
  syncSet(v) { st.sync.gasUrl=v.trim(); save(); },
  uName(v) { st.userName=v; save(); },
  clrTok() { if(confirm('تاریخچه توکن پاک شود؟')) { st.tokenLogs=[]; save(); render(); } },
  async fetchModels() {
    const k=(st.api.geminiKey||'').trim(); if(!k) return this.toast('ابتدا کلید Gemini را وارد کنید','wr');
    const b=$('fModBtn'); if(b){b.disabled=true;b.textContent='⏳...';}
    try {
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(k)}`), d=await r.json();
      if(!r.ok) throw new Error(d.error?.message||'HTTP '+r.status);
      const ms=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,'')).sort((a,b)=>b.localeCompare(a));
      if(!ms.length) throw new Error('مدلی یافت نشد');
      st.api.geminiModels=ms; if(!ms.includes(st.api.geminiModel)) st.api.geminiModel=ms[0];
      save(); render(); this.toast(ms.length+' مدل فعال دریافت شد','ok');
    } catch(e) { this.toast('خطا: '+e.message,'er'); if(b){b.disabled=false;b.textContent='🔄 دریافت مدل‌ها';} }
  },
  async testApi() {
    const b=$('testBtn'), box=$('testRes'); if(b){b.disabled=true;b.textContent='⏳...';}
    try {
      const r = await callAI('فقط کلمه متصل را بنویس.','تست اتصال زنده');
      render();
      const nb=$('testRes'); if(nb) nb.innerHTML=`<span class="dot"></span><b style="color:var(--ok)">متصل شد!</b> مدل: <code>${esc(r.mod)}</code> | زمان: <b>${r.ms}ms</b>`;
      this.toast(`اتصال موفق (${r.ms}ms)`,'ok');
    } catch(e) {
      if(box) box.innerHTML=`<span class="dot e"></span><b style="color:var(--er)">خطا:</b> ${esc(e.message)}`;
      if(b){b.disabled=false;b.textContent='📡 تست اتصال زنده';}
      this.toast('اتصال برقرار نشد','er');
    }
  },
  async syncPush() {
    const u=st.sync.gasUrl; if(!u) return this.toast('لینک وب‌اپ گوگل شیت را وارد کنید','wr');
    try {
      const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',author:st.userName,data:teamPayload()})}), j=await r.json();
      if(!j.ok) throw new Error(j.error);
      st.sync.lastAt=j.updatedAt||now(); st.sync.lastBy=st.userName; save(); render(); this.toast('به گوگل شیت ارسال شد!','ok');
    } catch(e) { this.toast('خطای ارسال: '+e.message,'er'); }
  },
  async syncPull() {
    const u=st.sync.gasUrl; if(!u) return this.toast('لینک وب‌اپ گوگل شیت را وارد کنید','wr');
    try {
      const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now()), j=await r.json();
      if(!j.ok) throw new Error(j.error); if(j.empty||!j.data) return this.toast('سرور هنوز خالی است؛ ابتدا Push بزنید','wr');
      Object.assign(st, { stages:j.data.stages||st.stages, prompts:j.data.prompts||[], notes:j.data.notes||[], tasks:j.data.tasks||[], workflows:j.data.workflows||[], resources:j.data.resources||[] });
      st.sync.lastAt=j.updatedAt||now(); st.sync.lastBy=j.lastAuthor||''; save(); render(); this.toast('آخرین نسخه تیم دریافت شد!','ok');
    } catch(e) { this.toast('خطای دریافت: '+e.message,'er'); }
  },
  async syncSmart() {
    const u=st.sync.gasUrl; if(!u) return this.toast('لینک وب‌اپ گوگل شیت را وارد کنید','wr');
    try {
      const gr=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now()), gj=await gr.json();
      if(!gj.ok) throw new Error(gj.error); if(!gj.empty&&gj.data) mergeTeam(gj.data);
      const pr=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',author:st.userName,data:teamPayload()})}), pj=await pr.json();
      if(!pj.ok) throw new Error(pj.error);
      st.sync.lastAt=pj.updatedAt||now(); st.sync.lastBy=st.userName; save(); render(); this.toast('همگام‌سازی هوشمند (ادغام و ذخیره) موفق بود!','ok');
    } catch(e) { this.toast('خطای همگام‌سازی: '+e.message,'er'); }
  },
  cpGas() { copy($('gasTpl').textContent.trim(), 'کد کامل Code.gs کپی شد!'); },
  expJson() { const s={...st,api:{...st.api,geminiKey:'',openaiKey:''}}; dl(`ai-backup-${now().slice(0,10)}.json`,JSON.stringify(s,null,2),'application/json;charset=utf-8'); this.toast('بکاپ JSON دانلود شد','ok'); },
  async saveFile() {
    const c=JSON.stringify(teamPayload(),null,2);
    if (window.showSaveFilePicker) {
      try {
        if(!fileHandle) fileHandle = await showSaveFilePicker({ suggestedName:'ai-command-db.json', types:[{description:'JSON',accept:{'application/json':['.json']}}] });
        const w = await fileHandle.createWritable(); await w.write(c); await w.close(); render(); return this.toast('در فایل محلی ذخیره شد','ok');
      } catch(e) { if(e.name==='AbortError') return; }
    }
    dl('ai-command-db.json',c,'application/json;charset=utf-8');
  },
  async openFile() {
    if (window.showOpenFilePicker) {
      try {
        const [h] = await showOpenFilePicker({ types:[{description:'JSON',accept:{'application/json':['.json']}}] });
        fileHandle = h; mergeTeam(JSON.parse(await (await h.getFile()).text())); save(); render(); return this.toast('فایل محلی ادغام شد','ok');
      } catch(e) { if(e.name==='AbortError') return; }
    }
    $('jsonFile').click();
  },
  expDoc(fmt, sc='all') {
    const d=now().slice(0,10), iP=sc==='all'||sc==='prompts', iN=sc==='all'||sc==='notes', iW=sc==='all'||sc==='workflows';
    if (fmt==='md') {
      let m=`# مستندات اتاق فرمان هوش مصنوعی (${fDT(now())})\n\n`;
      if(iP){ m+=`## پرامپت‌ها\n`; st.prompts.forEach((p,i)=>m+=`### ${i+1}. ${p.title} (${p.version})\nمرحله: ${sName(p.stageId)} | مدل: ${p.model||'—'}\n\`\`\`\n${p.text}\n\`\`\`\n\n`); }
      if(iN){ m+=`## تجربیات\n`; st.notes.forEach((n,i)=>m+=`### ${i+1}. ${n.title}\nنویسنده: ${n.author} | ${fDate(n.date)}\n\n${n.content}\n\n`); }
      if(iW){ m+=`## فرآیندها\n`; st.workflows.forEach((w,i)=>{ m+=`### ${i+1}. ${w.title}\n`; (w.steps||[]).forEach((s,j)=>m+=`${j+1}. ${sName(s.stageId)} ${s.note?'— '+s.note:''}\n`); m+='\n'; }); }
      dl(`docs-${sc}-${d}.md`,'\uFEFF'+m,'text/markdown;charset=utf-8');
    } else {
      let b=`<h1>مستندات اتاق فرمان هوش مصنوعی</h1><p>تاریخ: ${fDT(now())}</p>`;
      if(iP){ b+=`<h2>خزانه پرامپت‌ها</h2>`; st.prompts.forEach((p,i)=>b+=`<h3>${i+1}. ${esc(p.title)} (${esc(p.version)})</h3><p>مرحله: ${esc(sName(p.stageId))} | مدل: ${esc(p.model||'—')}</p><div class="bx">${esc(p.text).replace(/\n/g,'<br>')}</div>`); }
      if(iN){ b+=`<h2>دفترچه تجربیات</h2>`; st.notes.forEach((n,i)=>b+=`<h3>${i+1}. ${esc(n.title)}</h3><p>${esc(n.author)} | ${fDate(n.date)}</p><p>${esc(n.content).replace(/\n/g,'<br>')}</p><hr>`); }
      if(iW){ b+=`<h2>فرآیندهای کاری</h2>`; st.workflows.forEach((w,i)=>{ b+=`<h3>${i+1}. ${esc(w.title)}</h3><ol>${(w.steps||[]).map(s=>`<li><b>${esc(sName(s.stageId))}</b> ${esc(s.note||'')}</li>`).join('')}</ol>`; }); }
      const html=`\uFEFF<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" lang="fa" dir="rtl"><head><meta charset="utf-8"><style>body{font-family:Vazirmatn,'B Nazanin',Tahoma,sans-serif;direction:rtl;text-align:right;line-height:1.8}h1,h2{color:#312e81}.bx{background:#f8fafc;border:1px solid #cbd5e1;padding:10px;margin:8px 0}</style></head><body>${b}</body></html>`;
      dl(`docs-${sc}-${d}.doc`,html,'application/msword;charset=utf-8');
    }
    this.toast('فایل مستندات دانلود شد','ok');
  },
  clearSample() { if(!confirm('فقط داده‌های نمونه پاک شوند؟')) return; ['prompts','notes','tasks','workflows','resources'].forEach(k=>st[k]=st[k].filter(x=>!x.isSample)); save(); render(); this.toast('داده‌های نمونه پاک شدند','ok'); },
  reSample() { mergeTeam(defaults()); save(); render(); this.toast('داده‌های نمونه اضافه شدند','in'); },
  resetAll() { if(!confirm('تمام داده‌های سامانه پاک شود؟')) return; localStorage.removeItem(KEY); st=defaults(); save(); render(); this.toast('بازنشانی کامل انجام شد','wr'); }
};
document.addEventListener('DOMContentLoaded', () => App.init());
})();
</script>
</body>
