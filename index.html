<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>اتاق فرمان هوش مصنوعی و فناوری مرکز</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--font:'Vazirmatn',system-ui,Tahoma,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;--r-sm:8px;--r-md:12px;--r-lg:16px;--sw:268px;--th:62px;--tr:.17s ease}
[data-theme="light"]{--bg:#f4f6fb;--side:#ffffff;--surf:#ffffff;--sub:#eef2f7;--hov:#e4eaf3;--code:#f8fafc;--t1:#0f172a;--t2:#475569;--t3:#64748b;--bd:#e2e8f0;--bd2:#cbd5e1;--ac:#4f46e5;--ac2:#4338ca;--acs:#eef2ff;--act:#3730a3;--ok:#15803d;--oks:#dcfce7;--wr:#b45309;--wrs:#fef3c7;--er:#b91c1c;--ers:#fee2e2;--in:#0369a1;--ins:#e0f2fe;--sh1:0 1px 3px rgba(15,23,42,.05);--sh2:0 8px 22px rgba(15,23,42,.07);--sh3:0 22px 48px rgba(15,23,42,.18)}
[data-theme="dark"]{--bg:#0b0f17;--side:#111622;--surf:#161c2b;--sub:#1e2638;--hov:#263046;--code:#0f1420;--t1:#e8eef7;--t2:#a6b2c6;--t3:#7a879e;--bd:#263145;--bd2:#384661;--ac:#6366f1;--ac2:#818cf8;--acs:rgba(99,102,241,.18);--act:#a5b4fc;--ok:#4ade80;--oks:rgba(34,197,94,.16);--wr:#fbbf24;--wrs:rgba(245,158,11,.16);--er:#f87171;--ers:rgba(239,68,68,.16);--in:#38bdf8;--ins:rgba(56,189,248,.16);--sh1:0 2px 6px rgba(0,0,0,.35);--sh2:0 10px 26px rgba(0,0,0,.45);--sh3:0 24px 55px rgba(0,0,0,.65)}
[data-theme="warm"]{--bg:#f6f1e7;--side:#efe6d5;--surf:#fbf7ef;--sub:#ebe0cd;--hov:#e2d4bc;--code:#f3ecde;--t1:#2c2217;--t2:#5c4a38;--t3:#84705c;--bd:#ddd0ba;--bd2:#c7b69b;--ac:#9a4a1a;--ac2:#7d3911;--acs:#f4dfd0;--act:#843b12;--ok:#2f6b3c;--oks:#dff0e2;--wr:#9a6209;--wrs:#f9ebc8;--er:#a62b2b;--ers:#f7dddd;--in:#1d5b79;--ins:#dcecf3;--sh1:0 1px 3px rgba(44,34,23,.06);--sh2:0 8px 22px rgba(44,34,23,.09);--sh3:0 22px 48px rgba(44,34,23,.16)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--t1);line-height:1.68;font-size:14px;direction:rtl}
a{color:var(--act);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
textarea,.inp:not([dir="ltr"]){direction:rtl;text-align:right;unicode-bidi:plaintext}

.gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,var(--acs),transparent 55%),var(--bg)}
.gbox{width:100%;max-width:440px;background:var(--surf);border:1px solid var(--bd);border-radius:18px;padding:28px 24px;box-shadow:var(--sh3)}
.ghead{text-align:center;margin-bottom:20px}
.glogo{width:54px;height:54px;margin:0 auto 12px;border-radius:15px;background:linear-gradient(135deg,var(--ac),#7c3aed);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;box-shadow:0 8px 20px rgba(79,70,229,.28)}
.ghead h1{font-size:19px;font-weight:800}.ghead p{font-size:13px;color:var(--t2);margin-top:4px}

.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sw);background:var(--side);border-left:1px solid var(--bd);display:flex;flex-direction:column;position:fixed;top:0;right:0;bottom:0;z-index:40;transition:transform var(--tr)}
.brand{height:var(--th);padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd)}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--ac),#7c3aed);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0}
.brand h1{font-size:13.5px;font-weight:800;line-height:1.25}.brand span{font-size:11px;color:var(--t3);display:block}
.nav{padding:10px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.nav-lbl{font-size:11px;font-weight:700;color:var(--t3);padding:9px 10px 3px}
.nav-btn{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:var(--r-sm);border:none;background:transparent;color:var(--t2);cursor:pointer;text-align:right;width:100%;font-weight:500;transition:var(--tr)}
.nav-btn:hover{background:var(--hov);color:var(--t1)}.nav-btn.active{background:var(--acs);color:var(--act);font-weight:700}
.nav-btn svg{width:17px;height:17px;flex-shrink:0}
.nav-cnt{margin-right:auto;font-size:11px;background:var(--sub);color:var(--t3);padding:1px 7px;border-radius:99px;font-weight:700}
.nav-btn.active .nav-cnt{background:var(--ac);color:#fff}
.side-ft{padding:11px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:8px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sub);padding:3px;border-radius:var(--r-sm);gap:3px}
.th-btn{border:none;background:transparent;color:var(--t2);padding:5px 2px;border-radius:6px;font-size:11.5px;cursor:pointer}
.th-btn.active{background:var(--surf);color:var(--t1);box-shadow:var(--sh1);font-weight:700}
.upill{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;background:var(--sub);padding:7px 10px;border-radius:var(--r-sm)}

.main{flex:1;margin-right:var(--sw);display:flex;flex-direction:column;min-width:0}
.top{height:var(--th);background:var(--surf);border-bottom:1px solid var(--bd);padding:0 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30}
.m-tgl{display:none;background:transparent;border:1px solid var(--bd);border-radius:var(--r-sm);width:36px;height:36px;align-items:center;justify-content:center;cursor:pointer}
.gsearch{position:relative;flex:1;max-width:370px}
.gsearch input{width:100%;background:var(--sub);border:1px solid transparent;border-radius:var(--r-md);padding:7px 34px 7px 12px;font-size:13px;outline:none}
.gsearch input:focus{background:var(--surf);border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.gsearch svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--t3);width:16px;height:16px;pointer-events:none}
.gs-res{position:absolute;top:calc(100% + 6px);right:0;left:0;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-md);box-shadow:var(--sh3);max-height:360px;overflow-y:auto;z-index:60;display:none}
.gs-res.open{display:block}
.gs-item{padding:9px 12px;border-bottom:1px solid var(--bd);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
.gs-item:hover{background:var(--hov)}.gs-item:last-child{border-bottom:none}
.top-act{margin-right:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:600;background:var(--sub);color:var(--t1);border:1px solid var(--bd);cursor:pointer;transition:var(--tr);text-decoration:none}
.pill:hover{background:var(--hov);border-color:var(--ac);text-decoration:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}.dot.w{background:var(--wr)}.dot.e{background:var(--er)}
.qwrap{position:relative}
.qmenu{position:absolute;top:calc(100% + 6px);left:0;min-width:190px;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-md);box-shadow:var(--sh3);padding:5px;display:none;z-index:65;flex-direction:column;gap:2px}
.qmenu.open{display:flex}
.qmenu button{border:none;background:transparent;text-align:right;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.qmenu button:hover{background:var(--acs);color:var(--act)}

.wrap{padding:22px 24px 50px;max-width:1400px;width:100%;margin:0 auto}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.ph h2{font-size:20px;font-weight:800}.ph p{color:var(--t2);font-size:13px;margin-top:2px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 13px;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surf);color:var(--t1);font-weight:600;font-size:13px;cursor:pointer;transition:var(--tr);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hov);border-color:var(--bd2);text-decoration:none}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-p{background:var(--ac);border-color:var(--ac);color:#fff}.btn-p:hover{background:var(--ac2);border-color:var(--ac2)}
.btn-s{background:var(--acs);border-color:transparent;color:var(--act)}
.btn-d{background:var(--ers);border-color:transparent;color:var(--er)}
.btn-ok{background:var(--oks);border-color:transparent;color:var(--ok)}
.btn-sm{padding:5px 10px;font-size:12px}.btn-xs{padding:3px 8px;font-size:11.5px}

.fbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:16px;background:var(--surf);padding:11px 13px;border-radius:var(--r-md);border:1px solid var(--bd);box-shadow:var(--sh1)}
.inp,.sel,.ta{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-sm);padding:8px 11px;font-size:13px;outline:none;transition:var(--tr)}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.inp:disabled,.sel:disabled{background:var(--sub);opacity:.6;cursor:not-allowed}
.ta{width:100%;resize:vertical;line-height:1.75}
.fg2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.fg label{font-size:12.5px;font-weight:700;color:var(--t2)}.hint{font-size:11.5px;color:var(--t3)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:15px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-md);padding:16px;box-shadow:var(--sh1);display:flex;flex-direction:column;gap:10px;transition:var(--tr)}
.card:hover{border-color:var(--bd2);box-shadow:var(--sh2)}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ct{font-size:15px;font-weight:800;line-height:1.45}
.b{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--sub);color:var(--t2)}
.b-a{background:var(--acs);color:var(--act)}.b-ok{background:var(--oks);color:var(--ok)}.b-w{background:var(--wrs);color:var(--wr)}.b-e{background:var(--ers);color:var(--er)}.b-i{background:var(--ins);color:var(--in)}
.pre{background:var(--code);border:1px solid var(--bd);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;line-height:1.75;white-space:pre-wrap;max-height:160px;overflow-y:auto;direction:rtl;text-align:right;unicode-bidi:plaintext}
.cf{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--bd);margin-top:auto}
.meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--t3)}

.hero{background:linear-gradient(135deg,var(--acs),var(--surf) 68%);border:1px solid var(--bd);border-radius:var(--r-lg);padding:20px 22px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:13px;margin-bottom:18px}
.tile{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-md);padding:15px;cursor:pointer;transition:var(--tr);display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:var(--sh2)}
.home2{display:grid;grid-template-columns:1.2fr 1fr;gap:15px}

.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.kcol{min-width:305px;width:305px;flex-shrink:0;background:var(--sub);border:1px solid var(--bd);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:10px;transition:var(--tr)}
.kcol.drag-over{border:2px dashed var(--ac);background:var(--acs)}
.kch{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--bd);font-weight:800;font-size:13.5px}
.tcard{cursor:grab}.tcard:active{cursor:grabbing}
.pbar{height:7px;background:var(--sub);border-radius:99px;overflow:hidden}.pfill{height:100%;background:var(--ac);border-radius:99px}
.chkbox{display:flex;flex-direction:column;gap:5px;background:var(--code);border:1px solid var(--bd);border-radius:var(--r-sm);padding:8px 10px}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer}.chk input{accent-color:var(--ac);width:15px;height:15px}.chk.done span{text-decoration:line-through;color:var(--t3)}
.wlog{background:var(--code);border-right:3px solid var(--ac);padding:6px 9px;border-radius:6px;font-size:12px}

.chat-wrap{display:grid;grid-template-columns:250px 1fr;gap:14px;height:calc(100vh - 150px);min-height:480px}
.chat-side{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.chat-item{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;border:1px solid transparent;display:flex;justify-content:space-between;align-items:center;gap:6px}
.chat-item:hover{background:var(--sub)}.chat-item.active{background:var(--acs);color:var(--act);border-color:var(--ac);font-weight:700}
.chat-main{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-md);display:flex;flex-direction:column;overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:11px;background:var(--code)}
.msg{max-width:85%;padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.75;white-space:pre-wrap;unicode-bidi:plaintext}
.msg.u{align-self:flex-start;background:var(--ac);color:#fff;border-bottom-right-radius:3px}
.msg.a{align-self:flex-end;background:var(--surf);border:1px solid var(--bd);border-bottom-left-radius:3px}
.chat-inp{padding:11px;border-top:1px solid var(--bd);background:var(--surf);display:flex;flex-direction:column;gap:8px}

.wstep{display:flex;align-items:flex-start;gap:11px;background:var(--code);border:1px solid var(--bd);border-radius:var(--r-sm);padding:10px 12px}
.snum{width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
.lab3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:14px}
.msw{display:inline-flex;background:var(--sub);border:1px solid var(--bd);border-radius:var(--r-md);padding:3px;gap:3px}
.mbtn{border:none;background:transparent;padding:6px 12px;border-radius:var(--r-sm);font-size:12.5px;font-weight:700;color:var(--t2);cursor:pointer}
.mbtn.active{background:var(--surf);color:var(--act);box-shadow:var(--sh1)}
.twrap{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--surf)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--bd)}th{background:var(--sub);font-weight:700;color:var(--t2);font-size:12px}tr:last-child td{border-bottom:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--sh1)}.kpi small{font-size:12px;color:var(--t3)}.kpi b{display:block;font-size:21px;margin-top:2px;font-weight:800}

.mbg{position:fixed;inset:0;background:rgba(15,23,42,.58);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}
.mbg.open{display:flex}
.mdl{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-lg);box-shadow:var(--sh3);width:100%;max-width:740px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.mdl.lg{max-width:920px}
.mh{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}.mh h3{font-size:15.5px;font-weight:800}
.mb{padding:16px 18px;overflow-y:auto;flex:1}.mf{padding:12px 18px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px;background:var(--sub)}
.diff2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.da{background:var(--oks);padding:1px 4px;border-radius:3px}.dd{background:var(--ers);padding:1px 4px;border-radius:3px}
.toasts{position:fixed;bottom:18px;left:18px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:390px}
.toast{background:var(--surf);color:var(--t1);border:1px solid var(--bd);border-right:4px solid var(--ac);border-radius:var(--r-md);padding:10px 14px;box-shadow:var(--sh3);font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.toast.ok{border-right-color:var(--ok)}.toast.er{border-right-color:var(--er)}.toast.wr{border-right-color:var(--wr)}
.empty{text-align:center;padding:40px 18px;background:var(--surf);border:1px dashed var(--bd2);border-radius:var(--r-md);color:var(--t3)}
.ovl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
.stabs{display:flex;gap:6px;border-bottom:1px solid var(--bd);margin-bottom:16px;overflow-x:auto;padding-bottom:7px}
.stbtn{border:none;background:transparent;padding:7px 14px;border-radius:var(--r-sm);font-weight:700;font-size:13px;color:var(--t2);cursor:pointer;white-space:nowrap}
.stbtn.active{background:var(--acs);color:var(--act)}
.notice{background:var(--ins);color:var(--in);border:1px solid var(--bd);border-radius:var(--r-sm);padding:8px 11px;font-size:12px}
@media(max-width:1024px){.lab3,.diff2,.home2,.chat-wrap{grid-template-columns:1fr}.chat-wrap{height:auto}.chat-side{max-height:170px}}
@media(max-width:860px){.sidebar{transform:translateX(100%)}.sidebar.open{transform:translateX(0)}.ovl.open{display:block}.main{margin-right:0}.m-tgl{display:inline-flex}.fg2,.grid{grid-template-columns:1fr}.wrap{padding:14px 12px 36px}.top{padding:0 10px}}
</style>
</head>
<body>

<div id="gate" class="gate" style="display:none"></div>

<div id="shell" class="shell" style="display:none">
  <div id="ovl" class="ovl" onclick="App.side(false)"></div>
  <aside id="side" class="sidebar">
    <div class="brand"><div class="logo">ع</div><div><h1>اتاق فرمان هوش مصنوعی</h1><span>مرکز فقهی و فناوری هوشمند</span></div></div>
    <nav id="nav" class="nav"></nav>
    <div class="side-ft">
      <div class="upill">
        <div><strong id="uLbl">👤 کاربر</strong><div id="uRole" class="hint"></div></div>
        <button class="btn btn-d btn-xs" onclick="App.logout()">خروج</button>
      </div>
      <div class="themes">
        <button class="th-btn" data-th="light" onclick="App.theme('light')">☀️ روشن</button>
        <button class="th-btn" data-th="dark" onclick="App.theme('dark')">🌙 شب</button>
        <button class="th-btn" data-th="warm" onclick="App.theme('warm')">📜 کاغذی</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="m-tgl" onclick="App.side(true)" aria-label="منو">☰</button>
      <div class="gsearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="gsInp" type="search" placeholder="جستجوی سراسری در کل سامانه..." oninput="App.gSearch(this.value)" onfocus="App.gSearch(this.value)" />
        <div id="gsRes" class="gs-res"></div>
      </div>
      <div class="top-act">
        <a id="studioTopLink" class="pill" href="transcribe.html">🎙️ استودیو صوت ↗</a>
        <button id="apiPill" class="pill" onclick="App.go('settings','api')" title="وضعیت اتصال هوش مصنوعی"></button>

  allLogs.sort((a,b) => Date.parse(b.createdAt||0) - Date.parse(a.createdAt||0));

  return `
  <div class="hero">
    <div><h2 style="font-size:20px;font-weight:800">سلام ${esc(u.name)} 👋</h2>
      <p style="color:var(--t2);font-size:13px;margin-top:3px">به اتاق فرمان هوشمند مرکز خوش آمدید. ارتباط کامل با استودیو صوت، پیام‌رسان‌های ایتا/بله/تلگرام و گوگل درایو آماده است.</p></div>
    <div class="row">
      ${can('studioUse')?`<a class="btn btn-ok" href="${esc(audioUrl)}">🎙️ استودیو صوت و تقریر ↗</a>`:''}
      ${can('chat')?`<button class="btn btn-p" onclick="App.go('chat')">💬 چت سریع با AI</button>`:''}
      ${can('tasks','edit')?`<button class="btn" onclick="App.mTask()">+ کار جدید</button>`:''}
      ${can('ideas','edit')?`<button class="btn btn-s" onclick="App.mIdea()">💡 ثبت ایده</button>`:''}

  </div>

  <div class="kpis">
    <div class="kpi"><small>کارهای فعال من</small><b>${myTasks.length}</b></div>
    <div class="kpi"><small>کارهای فوری</small><b style="color:var(--er)">${urgent.length}</b></div>
    <div class="kpi"><small>پروژه‌های فعال</small><b>${live(st.projects).filter(p=>!p.archived).length}</b></div>
    <div class="kpi"><small>ایده‌های ثبت‌شده</small><b>${live(st.ideas).length}</b></div>
    <div class="kpi"><small>پرامپت‌های خزانه</small><b>${live(st.prompts).length}</b></div>
    <div class="kpi"><small>تجربیات ثبت‌شده</small><b>${live(st.notes).length}</b></div>
  </div>

  <div class="tiles">
    ${can('studioUse')?`<a class="tile" href="${esc(audioUrl)}" style="text-decoration:none;color:inherit"><strong>🎙️ استودیو صوت و تقریر ↗</strong><span class="hint">پیاده‌سازی، روان‌سازی، خلاصه‌سازی، خروجی PDF/Word و اتصال به ایتا/بله/تلگرام</span></a>`:''}
    ${can('tasks','view')?`<div class="tile" onclick="App.go('pipeline')"><strong>🚀 خط تولید و پروژه‌ها</strong><span class="hint">مدیریت پروژه‌های متعدد، مراحل اختصاصی، جابه‌جایی کارت‌ها و یادداشت پیشرفت</span></div>`:''}
    ${can('chat')?`<div class="tile" onclick="App.go('chat')"><strong>💬 چت سریع و فایل</strong><span class="hint">گفتگو با مدل‌های جدید همراه با پیوست فایل متنی، صوتی، PDF و تصویر</span></div>`:''}
    ${can('prompts','view')?`<div class="tile" onclick="App.go('prompts')"><strong>✨ خزانه پرامپت‌ها</strong><span class="hint">پرامپت‌های دسته‌بندی‌شده با تاریخچه نسخه‌ها و ارسال به بله/تلگرام/ایتا</span></div>`:''}
    ${can('notes','view')?`<div class="tile" onclick="App.go('notes')"><strong>📝 دفترچه تجربیات</strong><span class="hint">ثبت ساختاریافته یافته‌ها، مشکلات و راه‌حل‌های علمی و فنی تیم</span></div>`:''}
    ${can('ideas','view')?`<div class="tile" onclick="App.go('ideas')"><strong>💡 بانک ایده‌ها</strong><span class="hint">ثبت سریع ایده‌های خام و تبدیل آن‌ها به پروژه یا کار اجرایی</span></div>`:''}
    ${(can('telegram')||can('bale')||can('eitaa'))?`<div class="tile" onclick="App.go('telegram')"><strong>📡 تلگرام، بله و ایتا</strong><span class="hint">دریافت پیام و صوت از بله/تلگرام و ارسال گزارش به کانال ایتا، بله و تلگرام</span></div>`:''}
    ${can('lab')?`<div class="tile" onclick="App.go('lab')"><strong>🧪 کارگاه اصلاح پرامپت</strong><span class="hint">بهبود خودکار پرامپت بر اساس مقایسه خروجی فعلی و خروجی مطلوب</span></div>`:''}
  </div>

  <div class="home2">
    <div class="card">
      <div class="ch"><div class="ct">✋ رادار جلوگیری از موازی‌کاری (در حال انجام الان)</div><span class="b b-a">${workingNow.length} مورد</span></div>
      ${workingNow.length ? workingNow.map(t=>`<div class="wlog" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div><strong>${esc(t.title)}</strong><div class="hint">👤 مشغول کار: <b>${esc(t.workingBy)}</b> | از ${fDT(t.workingAt)}</div></div>
        <button class="btn btn-xs" onclick="App.go('pipeline')">مشاهده</button>
      </div>`).join('') : `<div class="hint" style="padding:12px 0">در حال حاضر هیچ کاری توسط اعضا قفل نشده است. روی هر کار دکمه «من مشغولم» را بزنید تا بقیه ببینند.</div>`}
    </div>
    <div class="card">
      <div class="ch"><div class="ct">📌 آخرین یادداشت‌های پیشرفت تیم</div></div>
      ${allLogs.length ? allLogs.slice(0,5).map(l=>`<div class="wlog">
        <div class="row" style="justify-content:space-between"><b>${esc(l.author)}</b><span class="hint">${fDT(l.createdAt)}</span></div>
        <div class="hint">پروژه/کار: ${esc(l.taskTitle)} ${l.stageName?`(${esc(l.stageName)})`:''}</div>
        <div style="margin-top:3px">${esc(l.text)}</div>
      </div>`).join('') : `<div class="hint" style="padding:12px 0">هنوز یادداشت پیشرفتی ثبت نشده است.</div>`}
    </div>
  </div>`;
}

function vChat() {
  const chats = st.chats || [];
  let ch = chats.find(c => c.id === st.activeChatId);
  if (!ch && chats.length) { ch = chats[0]; st.activeChatId = ch.id; }
  const activeMod = (st.api.customModel||'').trim() || st.api.model;
  const okKey = !!(st.api.key||'').trim();

  return `
  <div class="ph"><div><h2>💬 چت سریع و هوشمند با پیوست فایل</h2><p>تست مستقیم پرامپت‌ها، ارسال صوت/تصویر/PDF/کد و ذخیره خروجی در پایگاه دانش</p></div>
    <div class="row">
      <span class="b ${okKey?'b-ok':'b-e'}">${okKey?'🟢 '+esc(activeMod):'🔴 کلید API تنظیم نشده'}</span>
      <select class="sel" onchange="App.chatLoadPrompt(this.value)"><option value="">+ تزریق پرامپت از خزانه...</option>${live(st.prompts).map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select>
      <button class="btn btn-p btn-sm" onclick="App.newChat()">+ گفتگوی جدید</button>
    </div></div>
  <div class="chat-wrap">
    <aside class="chat-side">
      <strong style="font-size:12px;color:var(--t3);padding:2px 4px">تاریخچه گفتگوها (${chats.length})</strong>
      ${chats.map(c=>`<div class="chat-item ${ch?.id===c.id?'active':''}" onclick="App.selChat('${c.id}')">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.title||'گفتگوی جدید')}</span>
        <button class="btn btn-xs" onclick="event.stopPropagation();App.delChat('${c.id}')">✕</button>
      </div>`).join('') || `<div class="hint" style="padding:10px">هنوز گفتگویی ندارید.</div>`}
    </aside>
    <section class="chat-main">
      <div id="chatBox" class="chat-msgs">
        ${ch && ch.msgs.length ? ch.msgs.map((m,i)=>`<div class="msg ${m.role==='user'?'u':'a'}">
          ${m.files?.length ? `<div class="row" style="margin-bottom:5px">${m.files.map(f=>`<span class="b b-i">📎 ${esc(f.name)}</span>`).join('')}</div>` : ''}
          <div>${esc(m.text)}</div>
          ${m.role==='model' ? `<div class="row" style="margin-top:8px;padding-top:6px;border-top:1px solid var(--bd)">
            <button class="btn btn-xs" onclick="App.cpChatMsg(${i})">📋 کپی</button>
            ${can('notes','edit')?`<button class="btn btn-s btn-xs" onclick="App.chatToNote(${i})">📝 ذخیره در تجربه</button>`:''}
            ${can('prompts','edit')?`<button class="btn btn-xs" onclick="App.chatToPrompt(${i})">✨ ذخیره به عنوان پرامپت</button>`:''}
          </div>` : ''}
        </div>`).join('') : `<div class="empty" style="margin:auto;border:none;background:transparent">پیام خود را بنویسید یا فایلی پیوست کنید تا با مدل <b>${esc(activeMod)}</b> گفتگو کنید.</div>`}
      </div>
      <div class="chat-inp">
        ${st.chatFiles.length ? `<div class="row">${st.chatFiles.map((f,i)=>`<span class="b b-a">📎 ${esc(f.name)} <b style="cursor:pointer" onclick="App.rmChatFile(${i})">✕</b></span>`).join('')}</div>` : ''}
        <div class="row">
          <button class="btn btn-sm" onclick="$('chatFile').click()">📎 پیوست فایل (صوت/PDF/عکس/متن)</button>
          <textarea id="chatTxt" class="ta" rows="2" style="flex:1" placeholder="پیام یا متن خود را بنویسید... (Ctrl+Enter برای ارسال)" onkeydown="if(event.ctrlKey&&event.key==='Enter')App.sendChat()"></textarea>
          <button id="chatSendBtn" class="btn btn-p" onclick="App.sendChat()">ارسال ↵</button>
        </div>
      </div>
    </section>
  </div>`;
}

function vPipe() {
  const projs = allProjectsView();
  const proj = activeProject();
  const ps = projStages(proj);
  const allTasks = live(st.tasks).filter(t => (showArch ? true : !t.archived));
  const projTasks = proj.id === '__legacy__'
    ? allTasks.filter(t => !t.projectId || !live(st.projects).some(p=>p.id===t.projectId))
    : allTasks.filter(t => t.projectId === proj.id);

  const people = [...new Set(projTasks.map(t=>t.assignee).filter(Boolean))];
  const list = projTasks.filter(t => {
    const q = flt.tq.trim().toLowerCase();
    return (!q || (t.title+' '+t.assignee+' '+t.statusNote).toLowerCase().includes(q)) && (!flt.ta || t.assignee===flt.ta) && (!flt.tp || t.priority===flt.tp);
  }).sort((a,b) => ({'فوری':0,'بالا':1,'عادی':2,'کم':3}[a.priority]??2) - ({'فوری':0,'بالا':1,'عادی':2,'کم':3}[b.priority]??2));

  const canE = can('tasks','edit'), canD = can('tasks','delete'), canS = can('stages');
  const relProj = proj.relatedId ? projById(proj.relatedId) : null;

  return `
  <div class="ph"><div><h2>🚀 خط تولید و مدیریت پروژه‌ها</h2><p>پروژه‌های متعدد با مراحل اختصاصی، جابه‌جایی Drag & Drop، قفل جلوگیری از موازی‌کاری و یادداشت پیشرفت</p></div>
    <div class="row">
      <div class="msw"><button class="mbtn ${tView==='kanban'?'active':''}" onclick="App.tView('kanban')">کانبان</button><button class="mbtn ${tView==='list'?'active':''}" onclick="App.tView('list')">جدول</button></div>
      <button class="btn btn-sm ${showArch?'btn-s':''}" onclick="App.toggleArch()">🗄️ ${showArch?'مخفی کردن بایگانی':'نمایش بایگانی'}</button>
      ${canE?`<button class="btn" onclick="App.mProject()">+ پروژه جدید</button>`:''}
      ${canE?`<button class="btn btn-p" onclick="App.mTask()">+ کار جدید</button>`:''}
    </div></div>

  <div class="card" style="margin-bottom:14px;padding:12px 15px">
    <div class="row" style="justify-content:space-between">
      <div class="row" style="flex:1">
        <strong style="font-size:13px">پروژه فعلی:</strong>
        <select class="sel" style="min-width:230px;font-weight:700" onchange="App.selProj(this.value)">
          ${projs.map(p=>`<option value="${p.id}" ${proj.id===p.id?'selected':''}>${esc(p.title)} (${esc(p.category||'عمومی')})${p.archived?' [بایگانی]':''}</option>`).join('')}
        </select>
        <span class="b b-a">${esc(proj.priority||'عادی')}</span>
        ${proj.owner?`<span class="b">👤 ${esc(proj.owner)}</span>`:''}
        ${proj.dueDate?`<span class="b b-w">📅 ${fDate(proj.dueDate)}</span>`:''}
        ${relProj?`<button class="btn btn-xs btn-s" onclick="App.selProj('${relProj.id}')">🔗 مرتبط: ${esc(relProj.title)}</button>`:''}
      </div>
      <div class="row">
        ${!proj.isVirtual && canE ? `<button class="btn btn-xs" onclick="App.mProject('${proj.id}')">⚙️ ویرایش پروژه و مراحل</button>`:''}
        ${proj.isVirtual && canS ? `<button class="btn btn-xs" onclick="App.mStages()">⚙️ تنظیم مراحل عمومی</button>`:''}
        ${!proj.isVirtual && canD ? `<button class="btn btn-d btn-xs" onclick="App.delProject('${proj.id}')">حذف پروژه</button>`:''}
      </div>
    </div>
    ${proj.description?`<div class="hint" style="margin-top:6px">${esc(proj.description)}</div>`:''}
  </div>

  <div class="fbar">
    <input class="inp" style="flex:1;min-width:170px" placeholder="جستجو در کارهای این پروژه..." value="${esc(flt.tq)}" oninput="App.flt('tq',this.value)" />
    <select class="sel" onchange="App.flt('ta',this.value)"><option value="">همه مسئولان</option>${people.map(a=>`<option value="${esc(a)}" ${flt.ta===a?'selected':''}>👤 ${esc(a)}</option>`).join('')}</select>
    <select class="sel" onchange="App.flt('tp',this.value)"><option value="">همه اولویت‌ها</option>${['فوری','بالا','عادی','کم'].map(x=>`<option ${flt.tp===x?'selected':''}>${x}</option>`).join('')}</select>
  </div>

  ${tView==='kanban' ? `<div class="kanban">${ps.map((s,i)=>{ const ct = list.filter(t=>t.stageId===s.id || (!ps.some(x=>x.id===t.stageId)&&i===0)); return `
    <div class="kcol" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="this.classList.remove('drag-over');App.dropTask('${s.id}')">
      <div class="kch"><span><span class="b b-a">${i+1}</span> ${esc(s.name)}</span><span class="b">${ct.length}</span></div>
      ${ct.length ? ct.map(t=>taskCard(t,proj)).join('') : `<div style="text-align:center;padding:20px 6px;color:var(--t3);font-size:12px">کارتی اینجا نیست (می‌توانید بکشید و رها کنید)</div>`}
      ${canE?`<button class="btn btn-sm" style="width:100%;border-style:dashed" onclick="App.mTask(null,'${s.id}')">+ افزودن در این مرحله</button>`:''}
    </div>`; }).join('')}</div>`
  : `<div class="twrap"><table><thead><tr><th>عنوان</th><th>اولویت</th><th>مسئول</th><th>در حال کار</th><th>مرحله</th><th>پیشرفت</th><th>عملیات</th></tr></thead><tbody>
      ${list.map(t=>`<tr><td><strong>${esc(t.title)}</strong>${t.archived?' <span class="b">بایگانی</span>':''}</td><td>${prioBadge(t.priority)}</td><td>${esc(t.assignee||'—')}</td>
        <td>${t.workingBy?`<span class="b b-w">✋ ${esc(t.workingBy)}</span>`:'—'}</td>
        <td><select class="sel" style="padding:4px 7px;font-size:12px" ${canE?'':'disabled'} onchange="App.mvT('${t.id}',this.value)">${ps.map(s=>`<option value="${s.id}" ${t.stageId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></td>
        <td>${tPct(t,proj)}%</td>
        <td style="white-space:nowrap">${canE?`<button class="btn btn-xs" onclick="App.mTask('${t.id}')">باز کردن</button>`:''} ${canD?`<button class="btn btn-d btn-xs" onclick="App.delT('${t.id}')">حذف</button>`:''}</td></tr>`).join('') || `<tr><td colspan="7" style="text-align:center;padding:20px">کاری یافت نشد</td></tr>`}
    </tbody></table></div>`}`;
}

function prioBadge(p) {
  const cls = p==='فوری'?'b-e':(p==='بالا'?'b-w':(p==='کم'?'':'b-a'));
  return `<span class="b ${cls}">${p==='فوری'?'🔴 ':p==='بالا'?'🟠 ':''}${esc(p||'عادی')}</span>`;
}

function taskCard(t, proj) {
  const pct = tPct(t, proj), lp = t.promptId ? pById(t.promptId) : null;
  const relT = t.relatedId ? live(st.tasks).find(x=>x.id===t.relatedId) : null;
  const logs = t.workLogs || [], lastLog = logs[logs.length-1];
  const canE = can('tasks','edit'), canD = can('tasks','delete');
  const me = st.auth.user?.name || '', isMine = t.workingBy === me;
  const audioUrl = st.config?.audioToolUrl || 'transcribe.html';

  return `<div class="card tcard" draggable="${canE}" ondragstart="App.dragStart('${t.id}')" style="padding:12px;gap:7px">
    <div class="row" style="justify-content:space-between">${prioBadge(t.priority)}<span class="b">${esc(t.type||'کار')}</span><span class="b b-ok">${pct}%</span></div>
    <div style="font-weight:800;font-size:13.5px">${esc(t.title)}</div>
    <div class="meta"><span>👤 ${esc(t.assignee||'تعیین‌نشده')}</span>${t.dueDate?`<span>📅 ${fDate(t.dueDate)}</span>`:''}</div>
    ${t.workingBy ? `<div class="b b-w" style="justify-content:space-between;width:100%"><span>✋ در حال کار: <b>${esc(t.workingBy)}</b></span>${canE?`<button class="btn btn-xs" onclick="App.toggleWork('${t.id}')">${isMine?'رها کردن':'تغییر'}</button>`:''}</div>`
      : (canE?`<button class="btn btn-s btn-xs" style="width:100%" onclick="App.toggleWork('${t.id}')">✋ من مشغول این کار می‌شوم</button>`:'')}
    <div class="pbar"><div class="pfill" style="width:${pct}%"></div></div>
    ${lastLog ? `<div class="wlog"><b>${esc(lastLog.author)}:</b> ${esc(lastLog.text)}</div>` : (t.statusNote?`<div class="hint">📝 ${esc(t.statusNote)}</div>`:'')}
    <div class="row">
      ${lp?`<button class="btn btn-xs" onclick="App.cpP('${lp.id}')">📋 پرامپت</button>`:''}
      ${t.driveUrl?`<a class="b b-ok" href="${esc(t.driveUrl)}" target="_blank">📁 درایو ↗</a>`:''}
      ${relT?`<span class="b b-i">🔗 ${esc(relT.title.slice(0,20))}</span>`:''}
      ${can('studioUse') && /صوت|تقریر/.test(t.type||'')?`<a class="b b-a" href="${esc(audioUrl)}">🎙️ استودیو</a>`:''}
    </div>
    <div class="cf" style="padding-top:7px">
      ${canE?`<button class="btn btn-p btn-xs" onclick="App.mWorkLog('${t.id}')">💬 یادداشت (${logs.length})</button>`:`<span class="hint">${logs.length} یادداشت</span>`}
      <div class="row">${canE?`<button class="btn btn-xs" onclick="App.mTask('${t.id}')">جزئیات</button>`:''}${canD?`<button class="btn btn-d btn-xs" onclick="App.delT('${t.id}')">حذف</button>`:''}</div>
    </div>
  </div>`;
}

  const items = live(st.ideas), list = items.filter(i => (!flt.iq || (i.title+i.description).toLowerCase().includes(flt.iq.toLowerCase())) && (!flt.ic || i.category===flt.ic));
  const canE = can('ideas','edit'), canD = can('ideas','delete');
  return `
  <div class="ph"><div><h2>💡 بانک و تخته ایده‌ها</h2><p>ثبت سریع ایده‌های خام مرکز و تبدیل به پروژه یا کار</p></div>

  <div class="fbar">

    <select class="sel" onchange="App.flt('ic',this.value)"><option value="">همه دسته‌ها</option>${catsOf('ideas').map(c=>`<option ${flt.ic===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
  </div>
  ${!list.length ? `<div class="empty">هنوز ایده‌ای ثبت نشده است.</div>` : `<div class="grid">${list.map(x=>`
    <article class="card">
      <div class="ch"><div><div class="ct">${esc(x.title)}</div>
        <div class="row" style="margin-top:5px"><span class="b b-a">${esc(x.category||'عمومی')}</span>${prioBadge(x.priority)}<span class="b b-i">${esc(x.status||'خام')}</span></div></div></div>

    <div class="fg2">

      <button id="testBtn" class="btn btn-p btn-sm" onclick="App.testApi()">📡 تست اتصال زنده</button>

  ${sSub==='bots' && isAdmin ? `<div class="card">

    <p class="hint">اعضایی که مجوز داشته باشند، بدون دیدن توکن شما می‌توانند در هر دو نرم‌افزار پیام و فایل بفرستند یا از بله/تلگرام دریافت کنند.</p>
    <div class="fg2">
      <div class="fg"><label>توکن ربات تلگرام (BotFather)</label><input id="cTgT" class="inp" type="password" dir="ltr" value="${esc(st.config.tgToken||'')}" /></div>
      <div class="fg"><label>آیدی چت/کانال تلگرام</label><input id="cTgC" class="inp" dir="ltr" value="${esc(st.config.tgChatId||'')}" /></div>
      <div class="fg"><label>توکن ربات بله (از BotFather بله)</label><input id="cBaT" class="inp" type="password" dir="ltr" value="${esc(st.config.baleToken||'')}" /></div>
      <div class="fg"><label>آیدی چت/گروه/کانال بله</label><input id="cBaC" class="inp" dir="ltr" value="${esc(st.config.baleChatId||'')}" /></div>
      <div class="fg"><label>توکن ایتایار (eitaayar.ir)</label><input id="cEiT" class="inp" type="password" dir="ltr" value="${esc(st.config.eitaaToken||'')}" /></div>
      <div class="fg"><label>آیدی کانال/گروه ایتا</label><input id="cEiC" class="inp" dir="ltr" value="${esc(st.config.eitaaChatId||'')}" /></div>
    </div>
    <button class="btn btn-p" onclick="App.saveBots()">💾 ذخیره توکن‌ها در سرور</button>
  </div>` : ''}

  ${sSub==='custom' && canCust ? `<div class="card">
    <div class="ct">🎨 شخصی‌سازی دسته‌بندی‌ها و لینک استودیو صوت</div>
    <div class="fg"><label>لینک صفحه استودیو صوت و تقریر</label><div class="row"><input id="cAudUrl" class="inp" style="flex:1" dir="ltr" value="${esc(st.config.audioToolUrl||'transcribe.html')}" /><button class="btn btn-p btn-sm" onclick="App.saveAudioUrl()">ذخیره</button></div></div>
    <div class="fg2" style="margin-top:8px">
      ${[['prompts','دسته‌های پرامپت'],['notes','دسته‌های تجربیات'],['projects','دسته‌های پروژه'],['tasks','انواع کار'],['ideas','دسته‌های ایده'],['workflows','دسته‌های فرآیند'],['academy','دسته‌های آکادمی']].map(([k,lbl])=>`
      <div class="card" style="padding:11px"><strong>${lbl}</strong>
        <div class="row">${catsOf(k).map(c=>`<span class="b b-a">${esc(c)} <b style="cursor:pointer" onclick="App.rmCat('${k}','${esc(c)}')">✕</b></span>`).join('')}</div>
        <div class="row"><input id="nc_${k}" class="inp" style="flex:1" placeholder="دسته جدید..." /><button class="btn btn-xs btn-p" onclick="App.addCat('${k}')">+</button></div>
      </div>`).join('')}
    </div>
  </div>` : ''}

  ${sSub==='backup' && canEx ? `<div class="grid">
    <div class="card"><div class="ct">📦 بکاپ محلی JSON</div>
      <button class="btn btn-p" onclick="App.expJson()">⬇️ دانلود بکاپ کامل (.json)</button>
      <button class="btn" onclick="$('jsonFile').click()">⬆️ بارگذاری و ادغام فایل JSON</button></div>
    <div class="card"><div class="ct">📑 خروجی Word، PDF و Markdown</div>
      <select id="docScope" class="sel"><option value="all">کل مستندات</option><option value="prompts">پرامپت‌ها</option><option value="notes">تجربیات</option><option value="workflows">فرآیندها</option></select>
      <div class="row"><button class="btn btn-p" onclick="App.expDoc('doc',$('docScope').value)">📄 Word</button><button class="btn btn-s" onclick="App.expDoc('pdf',$('docScope').value)">📕 PDF</button><button class="btn" onclick="App.expDoc('md',$('docScope').value)">⬇ Markdown</button></div></div>
  </div>` : ''}`;
}

window.App = {
  init() {
    const sp = new URLSearchParams(location.search);
    if (sp.get('server')) { st.sync.gasUrl = sp.get('server').trim(); save(); history.replaceState(null,'',location.pathname); }
    this.theme(st.theme||'light', 1);
    document.addEventListener('click', e => {
      if (!e.target.closest('.gsearch')) $('gsRes')?.classList.remove('open');
      if (!e.target.closest('#qAddWrap')) $('qAddMenu')?.classList.remove('open');
    });
    $('jsonFile').addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const p = JSON.parse(rd.result);
          ['stages','projects','tasks','ideas','prompts','notes','workflows','resources'].forEach(k => {
            if (!Array.isArray(p[k])) return;
            const m = new Map(st[k].map(x=>[x.id,x]));
            p[k].forEach(x=>{ if(!x?.id) return; const o=m.get(x.id); if(!o||Date.parse(x.updatedAt||0)>Date.parse(o.updatedAt||0)) m.set(x.id,x); });
            st[k] = [...m.values()];
          });
          save(); scheduleSync(); render(); this.toast('بکاپ با موفقیت ادغام شد','ok');
        } catch (err) { this.toast('فایل نامعتبر: '+err.message,'er'); }
        e.target.value = '';
      };
      rd.readAsText(f);
    });
    $('chatFile').addEventListener('change', async e => {
      for (const f of e.target.files) {
        if (f.size > 15 * 1024 * 1024) { this.toast(`فایل ${f.name} بزرگ‌تر از ۱۵ مگابایت است`,'wr'); continue; }
        const isText = /^(text\/|application\/(json|javascript|xml))/.test(f.type) || /\.(txt|md|json|csv|js|py|html|css|xml)$/i.test(f.name);
        if (isText) {
          const text = await f.text();
          st.chatFiles.push({ name:f.name, kind:'text', mime:f.type||'text/plain', text });
        } else {
          const b64 = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(f); });
          st.chatFiles.push({ name:f.name, kind:'bin', mime:f.type||'application/octet-stream', data:b64 });
        }
      }
      e.target.value = ''; render();
    });
    render();
    if (st.auth.code && st.sync.gasUrl) this.syncNow(true);
  },

  _md(e) { mDownBg = (e.target === $('mbg')); },
  _mc(e) { if (mDownBg && e.target === $('mbg')) this.closeM(); mDownBg = false; },
  openM(t,b,f,lg=false) { $('mdl').className='mdl'+(lg?' lg':''); $('mTitle').textContent=t; $('mBody').innerHTML=b; $('mFoot').innerHTML=f; $('mbg').classList.add('open'); },
  closeM() { $('mbg').classList.remove('open'); },
  theme(t,silent) { st.theme=t; document.documentElement.setAttribute('data-theme',t); document.querySelectorAll('[data-th]').forEach(b=>b.classList.toggle('active',b.dataset.th===t)); if(!silent) save(); },
  side(o) { $('side').classList.toggle('open',o); $('ovl').classList.toggle('open',o); },
  go(t,sub) { tab=t; if(t==='settings'&&sub) sSub=sub; this.side(false); render(); window.scrollTo({top:0,behavior:'smooth'}); if(t==='members'&&!st.members.length) this.loadMembers(true); },
  sSub(s) { sSub=s; render(); },
  tView(v) { tView=v; render(); },
  flt(k,v) { flt[k]=v; render(); },
  toggleSrv() { showServerInp=!showServerInp; render(); },
  toggleQMenu(e) { e.stopPropagation(); $('qAddMenu').classList.toggle('open'); },
  closeQ() { $('qAddMenu').classList.remove('open'); },
  toast(msg,type='in',act=null) {
    const el=document.createElement('div'); el.className='toast '+type; el.innerHTML=`<span>${esc(msg)}</span>`;
    if(act){ const a=document.createElement('a'); a.href=act.href; a.target='_blank'; a.className='btn btn-p btn-xs'; a.textContent=act.label; el.appendChild(a); }
    $('toasts').appendChild(el); setTimeout(()=>el.remove(), act?5200:3200);
  },

  async login() {
    const uEl=$('gUrl'), cEl=$('gCode'), b=$('gBtn');
    if (uEl) st.sync.gasUrl = uEl.value.trim();
    const code = (cEl?.value||'').trim();
    if (!st.sync.gasUrl) return this.toast('لینک وب‌اپ گوگل شیت را وارد کنید','wr');
    if (!code) return this.toast('کد دسترسی را وارد کنید','wr');
    b.disabled=true; b.textContent='⏳ در حال بررسی...';
    try {
      const res = await gasPost({ action:'login', code });
      st.auth = { code, user:res.user };
      if (res.config) st.config = { ...st.config, ...res.config, categories:{ ...DEFAULT_CATS, ...(res.config.categories||{}) } };
      st.sync.revision = res.revision || 0;
      showServerInp = false; save();
      await this.syncNow(true);
      if (res.user.role==='admin') this.loadMembers(true);
      tab = 'home'; render(); this.toast(`خوش آمدید ${res.user.name}!`,'ok');
    } catch (e) { this.toast(e.message,'er'); b.disabled=false; b.textContent='🔓 ورود به سامانه'; }
  },
  logout() {
    if (!confirm('از حساب خارج می‌شوید؟')) return;
    clearTimeout(syncTimer);
    const th=st.theme, u=st.sync.gasUrl;
    st=emptyDb(); st.theme=th; st.sync.gasUrl=u; save(); render();
  },
  async syncNow(silent=false) {
    if (!st.auth.code || !st.sync.gasUrl || st.sync.syncing) return;
    st.sync.syncing = true; if (!silent) render();
    try {
      const res = await gasPost({
        action:'sync', code:st.auth.code,
        data:{ stages:st.stages, projects:st.projects, tasks:st.tasks, ideas:st.ideas, prompts:st.prompts, notes:st.notes, workflows:st.workflows, resources:st.resources }
      });
      st.auth.user = res.user;
      if (res.config) st.config = { ...st.config, ...res.config, categories:{ ...DEFAULT_CATS, ...(res.config.categories||{}) } };
      ['stages','projects','tasks','ideas','prompts','notes','workflows','resources'].forEach(k => st[k] = res.data[k] || []);
      st.sync.revision = res.revision || 0;
      st.sync.lastAt = res.serverTime || now();
      st.sync.syncing = false; save(); render();
      if (!silent) this.toast(`همگام‌سازی کامل شد (نسخه #${st.sync.revision})`,'ok');
    } catch (e) { st.sync.syncing=false; render(); this.toast('خطای همگام‌سازی: '+e.message,'er'); }
  },
  syncSet(k,v,rr) { st.sync[k]=v; save(); if(rr) render(); },

  selProj(id) { selProj=id; render(); },
  toggleArch() { showArch=!showArch; render(); },
  dragStart(id) { dragTaskId = id; },
  dropTask(stageId) { if(dragTaskId) { this.mvT(dragTaskId, stageId); dragTaskId=''; } },
  mProject(id=null) {
    const p = id ? projById(id) : null;
    const d = p || { title:'', category:catsOf('projects')[0]||'عمومی', priority:'عادی', status:'فعال', owner:st.auth.user?.name||'', dueDate:'', relatedId:'', description:'', stages:[{id:uid('ps'),name:'شروع و برنامه‌ریزی'},{id:uid('ps'),name:'در حال اجرا'},{id:uid('ps'),name:'بازبینی'},{id:uid('ps'),name:'تکمیل'}], archived:false };
    this._pStgDraft = JSON.parse(JSON.stringify(d.stages||[]));
    this.openM(p?'ویرایش پروژه و مراحل اختصاصی':'ایجاد پروژه جدید', `
      <div class="fg2">
        <div class="fg"><label>نام پروژه *</label><input id="prT" class="inp" value="${esc(d.title)}" /></div>
        <div class="fg"><label>دسته پروژه</label><div class="row"><select id="prC" class="sel" style="flex:1">${[...new Set([...catsOf('projects'),d.category].filter(Boolean))].map(c=>`<option ${d.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="btn btn-xs" onclick="App.inlineAddCat('projects','prC')">+</button></div></div>
        <div class="fg"><label>اولویت</label><select id="prP" class="sel">${['فوری','بالا','عادی','کم'].map(x=>`<option ${d.priority===x?'selected':''}>${x}</option>`).join('')}</select></div>
        <div class="fg"><label>مسئول پروژه</label><input id="prO" class="inp" value="${esc(d.owner)}" /></div>
        <div class="fg"><label>تاریخ هدف</label><input id="prD" class="inp" type="date" dir="ltr" value="${esc((d.dueDate||'').slice(0,10))}" /></div>
        <div class="fg"><label>مرتبط / وابسته به پروژه:</label><select id="prR" class="sel"><option value="">ندارد</option>${live(st.projects).filter(x=>x.id!==id).map(x=>`<option value="${x.id}" ${d.relatedId===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div>
      </div>
      <div class="fg"><label>توضیحات پروژه</label><textarea id="prDs" class="ta" rows="2">${esc(d.description||'')}</textarea></div>

  async fetchModels() {
    const a=st.api, key=(a.key||'').trim(); if(!key) return this.toast('ابتدا کلید API را وارد کنید','wr');
    const b=$('fModBtn'); if(b){b.disabled=true;b.textContent='⏳...';}
    try {

      if(a.provider==='gemini') {
        const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`), d=await r.json();

        ms=(d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,'')).sort((x,y)=>y.localeCompare(x));
      } else {
        const base=(a.baseUrl||st.catalog[a.provider]?.base||'').replace(/\/+$/,'');
        const r=await fetch(`${base}/models`,{headers:{'Authorization':'Bearer '+key}}), d=await r.json();

      }
      if(!ms.length) throw new Error('مدلی دریافت نشد');
      st.catalog[a.provider].models=ms; if(!ms.includes(st.api.model)) st.api.model=ms[0];
      save(); render(); this.toast(`${ms.length} مدل دریافت شد`,'ok');
    } catch(e){ this.toast(e.message,'er'); if(b){b.disabled=false;b.textContent='🔄 بروزرسانی زنده لیست مدل‌ها';} }

  async callChatAI(msgs, lastFiles) {
    const a=st.api, key=(a.key||'').trim(), t0=performance.now();
    if(!key) throw new Error('کلید API وارد نشده است.');
    const mod=(a.customModel||'').trim()||a.model, caps=modelCaps(a.provider,mod), lockP=a.lockParams||(!caps.temp&&!caps.topP);

    if (a.provider === 'gemini') {
      const contents = msgs.map((m, idx) => {
        const parts = [];
        if (m.text) parts.push({ text: m.text });
        if (idx === msgs.length - 1 && lastFiles?.length) {
          lastFiles.forEach(f => {
            if (f.kind === 'text') parts.push({ text: `\n--- فایل: ${f.name} ---\n${f.text}` });
            else parts.push({ inlineData: { mimeType: f.mime, data: f.data } });
          });
        }
        return { role: m.role === 'model' ? 'model' : 'user', parts };
      });
      const cfg = {};
      if (!lockP && caps.temp) cfg.temperature = +a.temp || 0.3;
      if (!lockP && caps.topP) cfg.topP = +a.topP || 0.9;
      if (caps.thinking && a.thinkingLevel) cfg.thinkingConfig = { thinkingLevel: a.thinkingLevel };
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(mod)}:generateContent?key=${encodeURIComponent(key)}`, {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ contents, generationConfig:cfg })
      });
      const d = await r.json().catch(()=>({})); if(!r.ok) { st.api.testedOk=false; save(); throw new Error(d.error?.message||'HTTP '+r.status); }
      const txt = (d.candidates?.[0]?.content?.parts||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('') || '';
      const tot = d.usageMetadata?.totalTokenCount || 0;
      st.api.testedOk = true; st.tokenLogs.push({ at:now(), pur:'چت/هوش مصنوعی', mod, tot }); save();
      return { txt, mod, tot, ms:Math.round(performance.now()-t0) };
    } else {
      const base=(a.baseUrl||st.catalog[a.provider]?.base||'https://openrouter.ai/api/v1').replace(/\/+$/,'');
      const oMsgs = msgs.map((m,idx)=>{
        let txt=m.text||'';
        if(idx===msgs.length-1&&lastFiles?.length) lastFiles.filter(f=>f.kind==='text').forEach(f=>txt+=`\n--- ${f.name} ---\n${f.text}`);
        return { role:m.role==='model'?'assistant':'user', content:txt };
      });
      const body={ model:mod, messages:oMsgs };
      if(!lockP&&caps.temp) body.temperature=+a.temp||0.3;
      if(!lockP&&caps.topP) body.top_p=+a.topP||0.9;
      const r=await fetch(`${base}/chat/completions`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify(body)});
      const d=await r.json().catch(()=>({})); if(!r.ok){st.api.testedOk=false;save();throw new Error(d.error?.message||'HTTP '+r.status);}
      const txt=d.choices?.[0]?.message?.content||'', tot=d.usage?.total_tokens||0;
      st.api.testedOk=true; st.tokenLogs.push({at:now(),pur:'چت/هوش مصنوعی',mod,tot}); save();
      return { txt, mod, tot, ms:Math.round(performance.now()-t0) };
    }
  },

    const b=$('drvBkBtn'); if(b){b.disabled=true;b.textContent='⏳ در حال ذخیره در درایو...';}
    try {
      const r = await gasPost({ action:'backupToDrive', code:st.auth.code });
      if(b){b.disabled=false;b.textContent='☁️ ذخیره بکاپ در گوگل درایو همین الان';}
      $('drvBkRes').innerHTML = `✅ ذخیره شد: <a href="${esc(r.folderUrl)}" target="_blank">باز کردن پوشه گوگل درایو ↗</a>`;
      this.toast('بکاپ با موفقیت در گوگل درایو ذخیره شد!','ok');
    } catch (e) { if(b){b.disabled=false;b.textContent='☁️ ذخیره بکاپ در گوگل درایو همین الان';} this.toast(e.message,'er'); }
  },
  async saveBots() {
    const cfg = {
      tgToken:$('cTgT').value.trim(), tgChatId:$('cTgC').value.trim(),
      baleToken:$('cBaT').value.trim(), baleChatId:$('cBaC').value.trim(),
      eitaaToken:$('cEiT').value.trim(), eitaaChatId:$('cEiC').value.trim()
    };
    try { const r=await gasPost({action:'saveConfig',code:st.auth.code,config:cfg}); st.config={...st.config,...r.config}; save(); render(); this.toast('توکن‌ها امن در سرور ذخیره شدند','ok'); }
    catch(e){ this.toast(e.message,'er'); }
  },
  async saveCatsToServer() {
    try { const r=await gasPost({action:'saveConfig',code:st.auth.code,config:{categories:st.config.categories,audioToolUrl:st.config.audioToolUrl}}); st.config={...st.config,...r.config}; save(); render(); }
    catch(e){ this.toast(e.message,'er'); }
  },
  saveAudioUrl() { st.config.audioToolUrl=$('cAudUrl').value.trim()||'transcribe.html'; save(); this.saveCatsToServer(); this.toast('ذخیره شد','ok'); },
  addCat(k) { const v=$('nc_'+k).value.trim(); if(!v)return; const l=catsOf(k); if(!l.includes(v)) l.push(v); st.config.categories[k]=l; save(); this.saveCatsToServer(); },
  rmCat(k,v) { st.config.categories[k]=catsOf(k).filter(x=>x!==v); save(); this.saveCatsToServer(); },
  inlineAddCat(k, selId) {
    const v = prompt('نام دسته جدید را بنویسید:'); if (!v?.trim()) return;
    const l = catsOf(k); if (!l.includes(v.trim())) l.push(v.trim());
    st.config.categories[k] = l; save();
    const sel = $(selId); if (sel) { sel.innerHTML += `<option selected>${esc(v.trim())}</option>`; sel.value = v.trim(); }
    if (can('customize') || st.auth.user?.role==='admin') this.saveCatsToServer();
  },

  async loadMembers(silent=false) { try{const r=await gasPost({action:'listMembers',code:st.auth.code}); st.members=r.members||[]; save(); render(); if(!silent)this.toast('بروزرسانی شد','ok');}catch(e){if(!silent)this.toast(e.message,'er');} },
  cpInvite() { copy(`${location.origin}${location.pathname}?server=${encodeURIComponent(st.sync.gasUrl||'')}`,'لینک دعوت کپی شد!'); },
  mMember(id=null) {
    const m=id?st.members.find(x=>x.id===id):null;
    const d=m||{name:'',code:'MEM-'+Math.floor(1000+Math.random()*9000),role:'member',active:true,perms:{prompts:'edit',notes:'edit',tasks:'edit',ideas:'edit',workflows:'view',academy:'view',stages:false,lab:true,chat:true,telegram:false,bale:false,eitaa:false,driveBackup:false,customize:false,export:true,api:false,studioUse:true,studioMulti:true,studioSharedEdit:false,studioStats:true,studioAllowedStages:[],studioAllowedCats:[]}};
    const pSel=(k,lbl)=>`<div class="fg"><label>${lbl}</label><select id="mp_${k}" class="sel"><option value="none" ${d.perms?.[k]==='none'?'selected':''}>ممنوع</option><option value="view" ${d.perms?.[k]==='view'?'selected':''}>فقط مشاهده</option><option value="edit" ${d.perms?.[k]==='edit'?'selected':''}>ثبت و ویرایش</option><option value="delete" ${d.perms?.[k]==='delete'?'selected':''}>کامل (+ حذف)</option></select></div>`;
    const pChk=(k,lbl,def=false)=>`<label class="chk"><input type="checkbox" id="mp_${k}" ${(d.perms?.[k]??def)?'checked':''}><span>${lbl}</span></label>`;
    this.openM(m?'ویرایش عضو و دسترسی‌ها':'افزودن عضو جدید', `
      <div class="fg2">
        <div class="fg"><label>نام *</label><input id="mN" class="inp" value="${esc(d.name)}" /></div>
        <div class="fg"><label>کد دسترسی *</label><div class="row"><input id="mC" class="inp" style="flex:1" dir="ltr" value="${esc(d.code)}" /><button class="btn btn-xs" onclick="$('mC').value='MEM-'+Math.floor(1000+Math.random()*9000)">🎲</button></div></div>
        <div class="fg"><label>نقش</label><select id="mR" class="sel" onchange="$('mPBox').style.display=this.value==='admin'?'none':'block'"><option value="member" ${d.role==='member'?'selected':''}>عضو تیم</option><option value="admin" ${d.role==='admin'?'selected':''}>👑 مدیر کل</option></select></div>
        <div class="fg"><label>وضعیت</label><select id="mA" class="sel"><option value="1" ${d.active?'selected':''}>فعال</option><option value="0" ${!d.active?'selected':''}>غیرفعال</option></select></div>
      </div>
      <div id="mPBox" style="display:${d.role==='admin'?'none':'block'};padding-top:8px;border-top:1px solid var(--bd)">
        <div class="fg2">${pSel('tasks','پروژه‌ها و کارها')}${pSel('ideas','بانک ایده‌ها')}${pSel('prompts','پرامپت‌ها')}${pSel('notes','تجربیات')}${pSel('workflows','فرآیندها')}${pSel('academy','آکادمی')}</div>
        <div class="row" style="margin-top:6px;margin-bottom:10px">${pChk('chat','چت سریع')}${pChk('lab','کارگاه پرامپت')}${pChk('telegram','تلگرام')}${pChk('bale','ربات بله')}${pChk('eitaa','ارسال ایتا')}${pChk('driveBackup','بکاپ درایو')}${pChk('stages','تنظیم مراحل')}${pChk('customize','تغییر دسته‌ها')}${pChk('export','خروجی Word/PDF/JSON')}${pChk('api','تنظیم API')}</div>
        <div style="background:var(--sub);padding:9px;border-radius:8px;">
          <strong style="font-size:12px;">🎙️ دسترسی‌های استودیو صوت و تقریر:</strong>
          <div class="row" style="margin-top:5px">${pChk('studioUse','ورود به استودیو صوت',true)}${pChk('studioMulti','تقریر چندمرحله‌ای',true)}${pChk('studioSharedEdit','ویرایش پروفایل عمومی استودیو',false)}${pChk('studioStats','مشاهده آمار هزینه',true)}</div>
          <div class="fg2" style="margin-top:7px">
            <div class="fg" style="margin:0"><label>مراحل مجاز استودیو (خالی = همه؛ مثلاً: st1, st2)</label><input id="mp_stgs" class="inp" dir="ltr" value="${esc((d.perms?.studioAllowedStages||[]).join(', '))}" /></div>
            <div class="fg" style="margin:0"><label>دسته‌های مجاز استودیو (خالی = همه؛ مثلاً: audio, smooth)</label><input id="mp_cats" class="inp" dir="ltr" value="${esc((d.perms?.studioAllowedCats||[]).join(', '))}" /></div>
          </div>
        </div>
      </div>`, `<button class="btn" onclick="App.closeM()">انصراف</button><button class="btn btn-p" onclick="App.saveMember('${id||''}')">💾 ذخیره</button>`, true);
  },
  async saveMember(id) {
    const name=$('mN').value.trim(), code=$('mC').value.trim(); if(!name||!code) return this.toast('نام و کد الزامی است','er');
    const perms={}; ['prompts','notes','tasks','ideas','workflows','academy'].forEach(k=>perms[k]=$('mp_'+k).value);
    ['stages','lab','chat','telegram','bale','eitaa','driveBackup','customize','export','api','studioUse','studioMulti','studioSharedEdit','studioStats'].forEach(k=>perms[k]=$('mp_'+k).checked);
    perms.studioAllowedStages = $('mp_stgs').value.split(/[،,]/).map(x=>x.trim()).filter(Boolean);
    perms.studioAllowedCats = $('mp_cats').value.split(/[،,]/).map(x=>x.trim()).filter(Boolean);
    try { const r=await gasPost({action:'saveMember',code:st.auth.code,member:{id:id||'',name,code,role:$('mR').value,active:$('mA').value==='1',perms}}); st.members=r.members||[]; if(id&&st.auth.user?.id===id)st.auth.code=code; save(); this.closeM(); render(); this.toast('ذخیره شد','ok'); }
    catch(e){ this.toast(e.message,'er'); }
  },
  async delMember(id) { if(!confirm('حذف شود؟'))return; try{const r=await gasPost({action:'deleteMember',code:st.auth.code,memberId:id}); st.members=r.members||[]; save(); render();}catch(e){this.toast(e.message,'er');} },

  gSearch(q) {
    const box=$('gsRes'), s=(q||'').trim().toLowerCase(); if(!s){box.classList.remove('open');return;}
    const res=[];
    live(st.projects).forEach(p=>{if((p.title+p.description).toLowerCase().includes(s))res.push(['پروژه',p.title,()=>{selProj=p.id;this.go('pipeline');}]);});
    live(st.tasks).forEach(t=>{if((t.title+t.assignee).toLowerCase().includes(s))res.push(['کار',t.title,()=>{this.go('pipeline');}]);});
    live(st.ideas).forEach(i=>{if((i.title+i.description).toLowerCase().includes(s))res.push(['ایده',i.title,()=>this.go('ideas')]);});
    live(st.prompts).forEach(p=>{if((p.title+p.text).toLowerCase().includes(s))res.push(['پرامپت',p.title,()=>this.jumpP(p.id)]);});
    live(st.notes).forEach(n=>{if((n.title+n.content).toLowerCase().includes(s))res.push(['تجربه',n.title,()=>this.jumpN(n.id)]);});
    searchActs=res.slice(0,9);
    box.innerHTML=searchActs.length?searchActs.map((x,i)=>`<div class="gs-item" onclick="App.runGS(${i})"><span>${esc(x[1])}</span><span class="b b-a">${x[0]}</span></div>`).join(''):`<div class="gs-item" style="color:var(--t3)">یافت نشد</div>`;
    box.classList.add('open');
  },
  runGS(i){ $('gsRes').classList.remove('open'); searchActs[i]?.[2](); },
  jumpP(id){ const p=pById(id); if(p){flt.pq=p.title;this.go('prompts');} },
  jumpN(id){ const n=nById(id); if(n){flt.nq=n.title;this.go('notes');} },
  mRes(id=null) {
    const r=id?live(st.resources).find(x=>x.id===id):null, d=r||{title:'',category:catsOf('academy')[0]||'عمومی',driveUrl:'',summary:'',linkedPromptIds:[],linkedNoteIds:[]};
    this.openM(r?'ویرایش منبع':'ثبت منبع آموزشی', `<div class="fg2"><div class="fg"><label>عنوان *</label><input id="rT" class="inp" value="${esc(d.title)}" /></div><div class="fg"><label>دسته</label><div class="row"><select id="rC" class="sel" style="flex:1">${[...new Set([...catsOf('academy'),d.category].filter(Boolean))].map(c=>`<option ${d.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="btn btn-xs" onclick="App.inlineAddCat('academy','rC')">+</button></div></div></div><div class="fg"><label>لینک درایو</label><input id="rD" class="inp" dir="ltr" value="${esc(d.driveUrl||'')}" /></div><div class="fg"><label>متن *</label><textarea id="rS" class="ta" rows="5">${esc(d.summary)}</textarea></div>`, `<button class="btn" onclick="App.closeM()">انصراف</button><button class="btn btn-p" onclick="App.saveR('${id||''}')">💾 ذخیره</button>`, true);
  },
  saveR(id) {
    const title=$('rT').value.trim(), summary=$('rS').value.trim(); if(!title||!summary)return this.toast('عنوان و متن الزامی است','er');
    const o={title,category:$('rC').value,driveUrl:$('rD').value.trim(),summary,linkedPromptIds:[],linkedNoteIds:[],updatedAt:now(),deletedAt:''};
    if(id) Object.assign(st.resources.find(x=>x.id===id),o); else st.resources.unshift({id:uid('r'),...o});
    save(); this.closeM(); render(); scheduleSync();
  },
  delR(id){ if(confirm('حذف شود؟')){const x=st.resources.find(r=>r.id===id);if(x){x.deletedAt=now();x.updatedAt=now();}save();render();scheduleSync();} },
  expJson(){ dl(`ai-backup-${now().slice(0,10)}.json`,JSON.stringify({stages:st.stages,projects:st.projects,tasks:st.tasks,ideas:st.ideas,prompts:st.prompts,notes:st.notes,workflows:st.workflows,resources:st.resources},null,2),'application/json;charset=utf-8'); },
  expDoc(fmt,sc='all') {
    const d=now().slice(0,10), ps=live(st.prompts), ns=live(st.notes), ws=live(st.workflows);
    const iP=sc==='all'||sc==='prompts', iN=sc==='all'||sc==='notes', iW=sc==='all'||sc==='workflows';
    if(fmt==='md'){
      let m=`# مستندات مرکز\n\n`;
      if(iP)ps.forEach(p=>m+=`## ${p.title}\n\`\`\`\n${p.text}\n\`\`\`\n\n`);
      if(iN)ns.forEach(n=>m+=`## ${n.title}\n${n.content}\n\n`);
      if(iW)ws.forEach(w=>m+=`## ${w.title}\n${w.description||''}\n\n`);
      dl(`docs-${d}.md`,'\uFEFF'+m,'text/markdown;charset=utf-8');
      return;
    }
    let b=`<h1 style="text-align:right;direction:rtl;color:#0f2c59">مستندات مرکز هوش مصنوعی</h1>`;
    if(iP)ps.forEach(p=>b+=`<h3 style="text-align:right;direction:rtl">${esc(p.title)} (${esc(p.version)})</h3><p dir="rtl" style="text-align:right;direction:rtl;background:#f8fafc;padding:8px;border:1px solid #cbd5e1">${esc(p.text).replace(/\n/g,'<br>')}</p>`);
    if(iN)ns.forEach(n=>b+=`<h3 style="text-align:right;direction:rtl">${esc(n.title)}</h3><p dir="rtl" style="text-align:right;direction:rtl">${esc(n.content).replace(/\n/g,'<br>')}</p>`);
    if(iW)ws.forEach(w=>b+=`<h3 style="text-align:right;direction:rtl">${esc(w.title)}</h3><p dir="rtl" style="text-align:right;direction:rtl">${esc(w.description||'')}</p>`);
    if(fmt==='pdf') {
      const fr=document.createElement('iframe'); fr.style.cssText='position:fixed;width:0;height:0;border:0;'; document.body.appendChild(fr);
      const doc=fr.contentWindow.document;
      doc.open(); doc.write(`<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>@page{size:A4;margin:18mm}body{font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl;text-align:right;line-height:1.9}</style></head><body>${b}</body></html>`); doc.close();
      setTimeout(()=>{ fr.contentWindow.focus(); fr.contentWindow.print(); setTimeout(()=>fr.remove(),2000); },400);
    } else {
      dl(`docs-${d}.doc`,'\uFEFF<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" lang="fa" dir="rtl"><head><meta charset="utf-8"><style>body,p,h1,h3{direction:rtl;text-align:right;font-family:Tahoma,sans-serif;line-height:1.8}</style></head><body dir="rtl">'+b+'</body></html>','application/msword;charset=utf-8');
    }
  }
};
document.addEventListener('DOMContentLoaded', () => App.init());
})();
</script>
