<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>اتاق فرمان دانش، پرامپت و خط تولید هوش مصنوعی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--font:'Vazirmatn',system-ui,Tahoma,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;--r-sm:8px;--r-md:12px;--r-lg:16px;--sw:268px;--th:62px;--tr:.18s ease}
[data-theme="light"]{--bg:#f4f6fb;--side:#ffffff;--surf:#ffffff;--sub:#eef2f7;--hov:#e4eaf3;--code:#f8fafc;--t1:#0f172a;--t2:#475569;--t3:#64748b;--bd:#e2e8f0;--bd2:#cbd5e1;--ac:#4f46e5;--ac2:#4338ca;--acs:#eef2ff;--act:#3730a3;--ok:#15803d;--oks:#dcfce7;--wr:#b45309;--wrs:#fef3c7;--er:#b91c1c;--ers:#fee2e2;--in:#0369a1;--ins:#e0f2fe;--sh1:0 1px 3px rgba(15,23,42,.05);--sh2:0 8px 22px rgba(15,23,42,.07);--sh3:0 22px 48px rgba(15,23,42,.18)}
[data-theme="dark"]{--bg:#0b0f17;--side:#111622;--surf:#161c2b;--sub:#1e2638;--hov:#263046;--code:#0f1420;--t1:#e8eef7;--t2:#a6b2c6;--t3:#7a879e;--bd:#263145;--bd2:#384661;--ac:#6366f1;--ac2:#818cf8;--acs:rgba(99,102,241,.18);--act:#a5b4fc;--ok:#4ade80;--oks:rgba(34,197,94,.16);--wr:#fbbf24;--wrs:rgba(245,158,11,.16);--er:#f87171;--ers:rgba(239,68,68,.16);--in:#38bdf8;--ins:rgba(56,189,248,.16);--sh1:0 2px 6px rgba(0,0,0,.35);--sh2:0 10px 26px rgba(0,0,0,.45);--sh3:0 24px 55px rgba(0,0,0,.65)}
[data-theme="warm"]{--bg:#f6f1e7;--side:#efe6d5;--surf:#fbf7ef;--sub:#ebe0cd;--hov:#e2d4bc;--code:#f3ecde;--t1:#2c2217;--t2:#5c4a38;--t3:#84705c;--bd:#ddd0ba;--bd2:#c7b69b;--ac:#9a4a1a;--ac2:#7d3911;--acs:#f4dfd0;--act:#843b12;--ok:#2f6b3c;--oks:#dff0e2;--wr:#9a6209;--wrs:#f9ebc8;--er:#a62b2b;--ers:#f7dddd;--in:#1d5b79;--ins:#dcecf3;--sh1:0 1px 3px rgba(44,34,23,.06);--sh2:0 8px 22px rgba(44,34,23,.09);--sh3:0 22px 48px rgba(44,34,23,.16)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--t1);line-height:1.68;font-size:14px}
a{color:var(--act);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* Login Gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,var(--acs),transparent 55%),var(--bg)}
.gbox{width:100%;max-width:440px;background:var(--surf);border:1px solid var(--bd);border-radius:18px;padding:28px 24px;box-shadow:var(--sh3)}
.ghead{text-align:center;margin-bottom:20px}
.glogo{width:54px;height:54px;margin:0 auto 12px;border-radius:15px;background:linear-gradient(135deg,var(--ac),#7c3aed);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;box-shadow:0 8px 20px rgba(79,70,229,.28)}
.ghead h1{font-size:19px;font-weight:800}.ghead p{font-size:13px;color:var(--t2);margin-top:4px}

/* Shell */
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sw);background:var(--side);border-left:1px solid var(--bd);display:flex;flex-direction:column;position:fixed;top:0;right:0;bottom:0;z-index:40;transition:transform var(--tr)}
.brand{height:var(--th);padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd)}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--ac),#7c3aed);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0}
.brand h1{font-size:13.5px;font-weight:800;line-height:1.25}.brand span{font-size:11px;color:var(--t3);display:block}
.nav{padding:12px 10px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.nav-lbl{font-size:11px;font-weight:700;color:var(--t3);padding:10px 10px 3px}
.nav-btn{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--r-sm);border:none;background:transparent;color:var(--t2);cursor:pointer;text-align:right;width:100%;font-weight:500;transition:var(--tr)}
.nav-btn:hover{background:var(--hov);color:var(--t1)}.nav-btn.active{background:var(--acs);color:var(--act);font-weight:700}
.nav-btn svg{width:17px;height:17px;flex-shrink:0}
.nav-cnt{margin-right:auto;font-size:11px;background:var(--sub);color:var(--t3);padding:1px 7px;border-radius:99px;font-weight:700}
.nav-btn.active .nav-cnt{background:var(--ac);color:#fff}
.side-ft{padding:12px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:8px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sub);padding:3px;border-radius:var(--r-sm);gap:3px}
.th-btn{border:none;background:transparent;color:var(--t2);padding:5px 2px;border-radius:6px;font-size:11.5px;cursor:pointer}
.th-btn.active{background:var(--surf);color:var(--t1);box-shadow:var(--sh1);font-weight:700}
.upill{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;background:var(--sub);padding:7px 10px;border-radius:var(--r-sm)}

.main{flex:1;margin-right:var(--sw);display:flex;flex-direction:column;min-width:0}
.top{height:var(--th);background:var(--surf);border-bottom:1px solid var(--bd);padding:0 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30}
.m-tgl{display:none;background:transparent;border:1px solid var(--bd);border-radius:var(--r-sm);width:36px;height:36px;align-items:center;justify-content:center;cursor:pointer}
.gsearch{position:relative;flex:1;max-width:440px}
.gsearch input{width:100%;background:var(--sub);border:1px solid transparent;border-radius:var(--r-md);padding:7px 34px 7px 12px;font-size:13px;outline:none}
.gsearch input:focus{background:var(--surf);border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.gsearch svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--t3);width:16px;height:16px;pointer-events:none}
.gs-res{position:absolute;top:calc(100% + 6px);right:0;left:0;background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-md);box-shadow:var(--sh3);max-height:360px;overflow-y:auto;z-index:60;display:none}
.gs-res.open{display:block}
.gs-item{padding:9px 12px;border-bottom:1px solid var(--bd);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
.gs-item:hover{background:var(--hov)}.gs-item:last-child{border-bottom:none}
.top-act{margin-right:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sync-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--sub);color:var(--t1);border:1px solid var(--bd);cursor:pointer;transition:var(--tr)}
.sync-btn:hover{background:var(--hov);border-color:var(--ac)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}.dot.w{background:var(--wr)}.dot.e{background:var(--er)}

.wrap{padding:22px 24px 48px;max-width:1380px;width:100%;margin:0 auto}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.ph h2{font-size:20px;font-weight:800}.ph p{color:var(--t2);font-size:13px;margin-top:2px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 13px;border-radius:var(--r-sm);border:1px solid var(--bd);background:var(--surf);color:var(--t1);font-weight:600;font-size:13px;cursor:pointer;transition:var(--tr);white-space:nowrap}
.btn:hover{background:var(--hov);border-color:var(--bd2)}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-p{background:var(--ac);border-color:var(--ac);color:#fff}.btn-p:hover{background:var(--ac2);border-color:var(--ac2)}
.btn-s{background:var(--acs);border-color:transparent;color:var(--act)}
.btn-d{background:var(--ers);border-color:transparent;color:var(--er)}
.btn-sm{padding:5px 10px;font-size:12px}.btn-xs{padding:3px 8px;font-size:11.5px}

.fbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:16px;background:var(--surf);padding:11px 13px;border-radius:var(--r-md);border:1px solid var(--bd);box-shadow:var(--sh1)}
.inp,.sel,.ta{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-sm);padding:8px 11px;font-size:13px;outline:none;transition:var(--tr)}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.ta{width:100%;resize:vertical;line-height:1.75}
.fg2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.fg label{font-size:12.5px;font-weight:700;color:var(--t2)}.hint{font-size:11.5px;color:var(--t3)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:15px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-md);padding:16px;box-shadow:var(--sh1);display:flex;flex-direction:column;gap:10px;transition:var(--tr)}
.card:hover{border-color:var(--bd2);box-shadow:var(--sh2)}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ct{font-size:15px;font-weight:800;line-height:1.45}
.b{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--sub);color:var(--t2)}
.b-a{background:var(--acs);color:var(--act)}.b-ok{background:var(--oks);color:var(--ok)}.b-w{background:var(--wrs);color:var(--wr)}.b-e{background:var(--ers);color:var(--er)}.b-i{background:var(--ins);color:var(--in)}
.pre{background:var(--code);border:1px solid var(--bd);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;line-height:1.75;white-space:pre-wrap;max-height:155px;overflow-y:auto}
.cf{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--bd);margin-top:auto}
.meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--t3)}

.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.kcol{min-width:300px;width:300px;flex-shrink:0;background:var(--sub);border:1px solid var(--bd);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:10px}
.kch{display:flex;align-items:center;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--bd);font-weight:800;font-size:13.5px}
.pbar{height:7px;background:var(--sub);border-radius:99px;overflow:hidden}.pfill{height:100%;background:var(--ac);border-radius:99px}
.chkbox{display:flex;flex-direction:column;gap:5px;background:var(--code);border:1px solid var(--bd);border-radius:var(--r-sm);padding:8px 10px}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;cursor:pointer}.chk input{accent-color:var(--ac);width:15px;height:15px}.chk.done span{text-decoration:line-through;color:var(--t3)}
.wstep{display:flex;align-items:flex-start;gap:11px;background:var(--code);border:1px solid var(--bd);border-radius:var(--r-sm);padding:10px 12px}
.snum{width:26px;height:26px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
.lab3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:14px}
.msw{display:inline-flex;background:var(--sub);border:1px solid var(--bd);border-radius:var(--r-md);padding:3px;gap:3px}
.mbtn{border:none;background:transparent;padding:6px 12px;border-radius:var(--r-sm);font-size:12.5px;font-weight:700;color:var(--t2);cursor:pointer}
.mbtn.active{background:var(--surf);color:var(--act);box-shadow:var(--sh1)}
.qimp{background:linear-gradient(135deg,var(--surf),var(--acs));border:1px dashed var(--ac);border-radius:var(--r-md);padding:14px;margin-bottom:16px}
.twrap{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r-md);background:var(--surf)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 11px;text-align:right;border-bottom:1px solid var(--bd)}th{background:var(--sub);font-weight:700;color:var(--t2);font-size:12px}tr:last-child td{border-bottom:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-md);padding:12px}.kpi small{font-size:12px;color:var(--t3)}.kpi b{display:block;font-size:19px;margin-top:3px}

.mbg{position:fixed;inset:0;background:rgba(15,23,42,.58);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}
.mbg.open{display:flex}
.mdl{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-lg);box-shadow:var(--sh3);width:100%;max-width:720px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.mdl.lg{max-width:900px}
.mh{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}.mh h3{font-size:15.5px;font-weight:800}
.mb{padding:16px 18px;overflow-y:auto;flex:1}.mf{padding:12px 18px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end;gap:8px;background:var(--sub)}
.diff2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.da{background:var(--oks);padding:1px 4px;border-radius:3px}.dd{background:var(--ers);padding:1px 4px;border-radius:3px}
.toasts{position:fixed;bottom:18px;left:18px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:var(--surf);color:var(--t1);border:1px solid var(--bd);border-right:4px solid var(--ac);border-radius:var(--r-md);padding:10px 14px;box-shadow:var(--sh3);font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.toast.ok{border-right-color:var(--ok)}.toast.er{border-right-color:var(--er)}.toast.wr{border-right-color:var(--wr)}
.hsec{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r-md);padding:18px;margin-bottom:14px}
.hsec h3{font-size:15.5px;font-weight:800;margin-bottom:9px;color:var(--act)}
.hlist{padding-right:19px;display:flex;flex-direction:column;gap:7px;color:var(--t2)}.hlist strong{color:var(--t1)}
.empty{text-align:center;padding:42px 18px;background:var(--surf);border:1px dashed var(--bd2);border-radius:var(--r-md);color:var(--t3)}
.ovl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
.stabs{display:flex;gap:6px;border-bottom:1px solid var(--bd);margin-bottom:16px;overflow-x:auto;padding-bottom:7px}
.stbtn{border:none;background:transparent;padding:7px 14px;border-radius:var(--r-sm);font-weight:700;font-size:13px;color:var(--t2);cursor:pointer;white-space:nowrap}
.stbtn.active{background:var(--acs);color:var(--act)}
.notice{background:var(--ins);color:var(--in);border:1px solid var(--bd);border-radius:var(--r-sm);padding:8px 11px;font-size:12px}
@media(max-width:1024px){.lab3,.diff2{grid-template-columns:1fr}}
@media(max-width:860px){.sidebar{transform:translateX(100%)}.sidebar.open{transform:translateX(0)}.ovl.open{display:block}.main{margin-right:0}.m-tgl{display:inline-flex}.fg2,.grid{grid-template-columns:1fr}.wrap{padding:14px 12px 36px}.top{padding:0 10px}}
</style>
</head>
<body>

<div id="gate" class="gate" style="display:none"></div>

<div id="shell" class="shell" style="display:none">
  <div id="ovl" class="ovl" onclick="App.side(false)"></div>
  <aside id="side" class="sidebar">
    <div class="brand"><div class="logo">ع</div><div><h1>اتاق فرمان هوش مصنوعی</h1><span>پایگاه دانش و خط تولید مرکز</span></div></div>
    <nav id="nav" class="nav"></nav>
    <div class="side-ft">
      <div class="upill">
        <div><strong id="uLbl">👤 کاربر</strong><div id="uRole" class="hint"></div></div>
        <button class="btn btn-d btn-xs" onclick="App.logout()">خروج</button>
      </div>
      <div class="themes">
        <button class="th-btn" data-th="light" onclick="App.theme('light')">☀️ روشن</button>
        <button class="th-btn" data-th="dark" onclick="App.theme('dark')">🌙 شب</button>
        <button class="th-btn" data-th="warm" onclick="App.theme('warm')">📜 کاغذی</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="m-tgl" onclick="App.side(true)" aria-label="منو">☰</button>
      <div class="gsearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="gsInp" type="search" placeholder="جستجوی سریع در کل پایگاه دانش..." oninput="App.gSearch(this.value)" onfocus="App.gSearch(this.value)" />
        <div id="gsRes" class="gs-res"></div>
      </div>
      <div class="top-act">
        <button id="syncBtn" class="sync-btn" onclick="App.syncNow(false)"><span class="dot" id="sDot"></span><span id="sTxt">همگام‌سازی</span></button>
        <button id="topNewP" class="btn btn-p btn-sm" onclick="App.mPrompt()">+ پرامپت جدید</button>
      </div>
    </header>
    <main class="wrap"><div id="root"></div></main>
  </div>
</div>

<div id="mbg" class="mbg" onmousedown="App._md(event)" onclick="App._mc(event)">
  <div id="mdl" class="mdl"><div class="mh"><h3 id="mTitle"></h3><button class="btn btn-sm" onclick="App.closeM()">✕ بستن</button></div><div id="mBody" class="mb"></div><div id="mFoot" class="mf"></div></div>
</div>
<div id="toasts" class="toasts"></div>
<input type="file" id="jsonFile" accept=".json" style="display:none" />

<script>
(() => {
'use strict';
const KEY = 'ilm_ai_cmd_v3';
const $ = id => document.getElementById(id);
const uid = p => p + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6);
const now = () => new Date().toISOString();
const esc = s => s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const fDate = d => { if (!d) return '—'; try { return new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(d)); } catch { return String(d).slice(0,10); } };
const fDT = d => { if (!d) return '—'; try { return new Intl.DateTimeFormat('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(d)); } catch { return String(d); } };
const pTags = s => (s || '').split(/[\s,،]+/).map(t => t.trim()).filter(Boolean).map(t => t.startsWith('#') ? t : '#' + t);
const nextV = v => { const m = (v || '').match(/^v?(\d+)\.(\d+)$/i); return m ? `v${m[1]}.${+m[2]+1}` : (v ? v + '.1' : 'v1.1'); };
const live = arr => (arr || []).filter(x => x && !x.deletedAt);
const liveStages = () => live(st.stages).slice().sort((a,b) => (a.sortOrder||0) - (b.sortOrder||0));

/* ---------- Smart AI Providers & Model Capabilities ---------- */
const DEFAULT_PROVIDERS = {
  gemini:     { label:'Google Gemini',         base:'',                                 models:['gemini-2.5-pro','gemini-2.5-flash','gemini-2.5-flash-lite','gemini-2.0-flash'] },
  openai:     { label:'OpenAI (ChatGPT)',      base:'https://api.openai.com/v1',        models:['gpt-4.1','gpt-4.1-mini','gpt-4o','o3','o4-mini'] },
  deepseek:   { label:'DeepSeek',              base:'https://api.deepseek.com/v1',      models:['deepseek-chat','deepseek-reasoner'] },

function modelCaps(provider, model) {

  if (isReasoning) return { temp: false, topP: false, reason: 'این مدل استدلالی (Reasoning) است و تنظیمات دما (Temperature) و Top-P را نمی‌پذیرد.' };

}

function can(sec, level='view') {
  const u = st.auth?.user;
  if (!u) return false;
  if (u.role === 'admin') return true;
  const p = u.perms || {};
  if (['stages','lab','export','api'].includes(sec)) return !!p[sec];
  if (sec === 'members') return false;
  const rank = { none:0, view:1, edit:2, delete:3 };
  return (rank[p[sec] || 'none'] || 0) >= (rank[level] || 1);
}

/* ---------- Utilities ---------- */
function copy(txt, msg = 'کپی شد', act = null) {
  const ok = () => App.toast(msg, 'ok', act);
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(ok).catch(() => fbCopy(txt, ok));
  else fbCopy(txt, ok);
}
function fbCopy(txt, cb) {
  const t = document.createElement('textarea'); t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0';
  document.body.appendChild(t); t.select(); try { document.execCommand('copy'); cb(); } catch { App.toast('خطا در کپی خودکار', 'er'); }
  document.body.removeChild(t);
}
function dl(name, content, mime) {
  const u = URL.createObjectURL(new Blob([content], { type: mime })), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(u), 900);
}

async function gasPost(payload) {
  const u = (st.sync.gasUrl || '').trim();
  if (!u) throw new Error('لینک وب‌اپ گوگل شیت وارد نشده است.');
  const r = await fetch(u, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload) });
  const j = await r.json().catch(() => ({}));
  if (!j.ok) throw new Error(j.error || 'خطا در ارتباط با گوگل شیت');
  return j;
}

/* ---------- Core App Logic ---------- */
window.App = {
  init() {
    const sp = new URLSearchParams(location.search);
    if (sp.get('server')) { st.sync.gasUrl = sp.get('server').trim(); save(); history.replaceState(null,'',location.pathname); }
    this.theme(st.theme || 'light', 1);
    document.addEventListener('click', e => { if (!e.target.closest('.gsearch')) $('gsRes')?.classList.remove('open'); });
    $('jsonFile').addEventListener('change', e => {
      const f = e.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const p = JSON.parse(rd.result);
          ['stages','prompts','notes','tasks','workflows','resources'].forEach(k => {
            if (!Array.isArray(p[k])) return;
            const m = new Map(st[k].map(x=>[x.id,x]));
            p[k].forEach(x=>{ if(!x?.id) return; const o=m.get(x.id); if(!o||Date.parse(x.updatedAt||0)>Date.parse(o.updatedAt||0)) m.set(x.id,x); });
            st[k] = [...m.values()];
          });
          save(); scheduleSync(); render(); this.toast('بکاپ با موفقیت ادغام شد','ok');
        } catch (err) { this.toast('فایل نامعتبر: '+err.message,'er'); }
        e.target.value = '';
      };
      rd.readAsText(f);
    });
    render();
    if (st.auth.code && st.sync.gasUrl) this.syncNow(true);
  },

  _md(e) { mDownBg = (e.target === $('mbg')); },
  _mc(e) { if (mDownBg && e.target === $('mbg')) this.closeM(); mDownBg = false; },
  openM(t, b, f, lg=false) { $('mdl').className='mdl'+(lg?' lg':''); $('mTitle').textContent=t; $('mBody').innerHTML=b; $('mFoot').innerHTML=f; $('mbg').classList.add('open'); },
  closeM() { $('mbg').classList.remove('open'); },
  theme(t, silent) { st.theme=t; document.documentElement.setAttribute('data-theme',t); document.querySelectorAll('[data-th]').forEach(b=>b.classList.toggle('active',b.dataset.th===t)); if(!silent) save(); },
  side(o) { $('side').classList.toggle('open',o); $('ovl').classList.toggle('open',o); },
  go(t, sub) { tab=t; if(t==='settings'&&sub) sSub=sub; this.side(false); render(); window.scrollTo({top:0,behavior:'smooth'}); if(t==='members'&&!st.members.length) this.loadMembers(true); },
  sSub(s) { sSub=s; render(); },
  tView(v) { tView=v; render(); },
  flt(k,v) { flt[k]=v; render(); },
  toggleSrv() { showServerInp = !showServerInp; render(); },
  toast(msg, type='in', act=null) {
    const el = document.createElement('div'); el.className = 'toast '+type; el.innerHTML = `<span>${esc(msg)}</span>`;
    if (act) { const a=document.createElement('a'); a.href=act.href; a.target='_blank'; a.className='btn btn-p btn-xs'; a.textContent=act.label; el.appendChild(a); }
    $('toasts').appendChild(el); setTimeout(()=>el.remove(), act?5200:3200);
  },

  /* Auth & Sync */
  async login() {
    const uEl = $('gUrl'), cEl = $('gCode'), b = $('gBtn');
    if (uEl) st.sync.gasUrl = uEl.value.trim();
    const code = (cEl?.value || '').trim();
    if (!st.sync.gasUrl) return this.toast('لینک وب‌اپ گوگل شیت را وارد کنید','wr');
    if (!code) return this.toast('کد دسترسی را وارد کنید','wr');
    b.disabled = true; b.textContent = '⏳ در حال بررسی...';
    try {
      const res = await gasPost({ action:'login', code });
      st.auth = { code, user: res.user };
      st.sync.revision = res.revision || 0;
      showServerInp = false;
      save();
      await this.syncNow(true);
      if (res.user.role === 'admin') this.loadMembers(true);
      render();
      this.toast(`خوش آمدید ${res.user.name}!`,'ok');
    } catch (e) {
      this.toast(e.message,'er');
      b.disabled = false; b.textContent = '🔓 ورود و دریافت اطلاعات تیم';
    }
  },
  logout() {
    if (!confirm('از حساب کاربری خارج می‌شوید؟')) return;
    clearTimeout(syncTimer);
    const keepTheme = st.theme, keepUrl = st.sync.gasUrl;
    st = emptyDb(); st.theme = keepTheme; st.sync.gasUrl = keepUrl;
    save(); render();
  },
  async syncNow(silent=false) {
    if (!st.auth.code || !st.sync.gasUrl || st.sync.syncing) return;
    st.sync.syncing = true; if (!silent) render();
    try {
      const res = await gasPost({
        action:'sync', code:st.auth.code,
        data:{ stages:st.stages, prompts:st.prompts, notes:st.notes, tasks:st.tasks, workflows:st.workflows, resources:st.resources }
      });
      st.auth.user = res.user;
      st.stages = res.data.stages || [];
      st.prompts = res.data.prompts || [];
      st.notes = res.data.notes || [];
      st.tasks = res.data.tasks || [];
      st.workflows = res.data.workflows || [];
      st.resources = res.data.resources || [];
      st.sync.revision = res.revision || 0;
      st.sync.lastAt = res.serverTime || now();
      st.sync.syncing = false;
      save(); render();
      if (!silent) this.toast(`همگام‌سازی کامل شد (نسخه #${st.sync.revision})`,'ok');
    } catch (e) {
      st.sync.syncing = false; render();
      this.toast('خطای همگام‌سازی: '+e.message,'er');
    }
  },
  syncSet(k,v,rr) { st.sync[k]=v; save(); if(rr) render(); },

  /* Members Admin */
  async loadMembers(silent=false) {
    try { const r = await gasPost({ action:'listMembers', code:st.auth.code }); st.members = r.members||[]; save(); render(); if(!silent) this.toast('لیست اعضا بروزرسانی شد','ok'); }
    catch (e) { if(!silent) this.toast(e.message,'er'); }
  },
  cpInvite() {
    const u = `${location.origin}${location.pathname}?server=${encodeURIComponent(st.sync.gasUrl||'')}`;
    copy(u, 'لینک دعوت آماده با آدرس سرور کپی شد!');
  },
  mMember(id=null) {
    const m = id ? st.members.find(x=>x.id===id) : null;
    const d = m || { name:'', code:'MEM-'+Math.floor(1000+Math.random()*9000), role:'member', active:true, perms:{ prompts:'edit', notes:'edit', tasks:'edit', workflows:'view', academy:'view', stages:false, lab:true, export:true, api:false } };
    const pSel = (k, lbl) => `<div class="fg"><label>${lbl}</label><select id="mp_${k}" class="sel">
      <option value="none" ${d.perms?.[k]==='none'?'selected':''}>بدون دسترسی</option>
      <option value="view" ${d.perms?.[k]==='view'?'selected':''}>فقط مشاهده</option>
      <option value="edit" ${d.perms?.[k]==='edit'?'selected':''}>مشاهده + ثبت و ویرایش</option>
      <option value="delete" ${d.perms?.[k]==='delete'?'selected':''}>کامل (+ حذف)</option>
    </select></div>`;
    this.openM(m?'ویرایش عضو و دسترسی‌ها':'افزودن عضو جدید', `
      <div class="fg2">
        <div class="fg"><label>نام و نام خانوادگی *</label><input id="mN" class="inp" value="${esc(d.name)}" /></div>
        <div class="fg"><label>کد دسترسی *</label><div class="row"><input id="mC" class="inp" style="flex:1" dir="ltr" value="${esc(d.code)}" /><button class="btn btn-xs" onclick="$('mC').value='MEM-'+Math.floor(1000+Math.random()*9000)">🎲</button></div></div>
        <div class="fg"><label>نقش</label><select id="mR" class="sel" onchange="$('mPBox').style.display=this.value==='admin'?'none':'block'"><option value="member" ${d.role==='member'?'selected':''}>عضو تیم</option><option value="admin" ${d.role==='admin'?'selected':''}>👑 مدیر کل</option></select></div>
        <div class="fg"><label>وضعیت حساب</label><select id="mA" class="sel"><option value="1" ${d.active?'selected':''}>فعال</option><option value="0" ${!d.active?'selected':''}>غیرفعال</option></select></div>
      </div>
      <div id="mPBox" style="display:${d.role==='admin'?'none':'block'};margin-top:8px;padding-top:10px;border-top:1px solid var(--bd)">
        <strong style="display:block;margin-bottom:8px;font-size:13px">تعیین دسترسی دقیق در هر بخش:</strong>
        <div class="fg2">${pSel('prompts','خزانه پرامپت‌ها')}${pSel('notes','دفترچه تجربیات')}${pSel('tasks','خط تولید و کارها')}${pSel('workflows','فرآیندها (SOP)')}${pSel('academy','آکادمی و منابع')}</div>
        <div class="row" style="margin-top:6px">
          <label class="chk"><input type="checkbox" id="mp_stages" ${d.perms?.stages?'checked':''}><span>تنظیم مراحل</span></label>
          <label class="chk"><input type="checkbox" id="mp_lab" ${d.perms?.lab?'checked':''}><span>کارگاه پرامپت</span></label>
          <label class="chk"><input type="checkbox" id="mp_export" ${d.perms?.export?'checked':''}><span>خروجی و بکاپ</span></label>
          <label class="chk"><input type="checkbox" id="mp_api" ${d.perms?.api?'checked':''}><span>تنظیم و تست API</span></label>
        </div>
      </div>`,
      `<button class="btn" onclick="App.closeM()">انصراف</button><button class="btn btn-p" onclick="App.saveMember('${id||''}')">💾 ذخیره عضو</button>`, true);
  },
  async saveMember(id) {
    const name=$('mN').value.trim(), code=$('mC').value.trim();
    if (!name || !code) return this.toast('نام و کد دسترسی الزامی است','er');
    const member = {
      id: id||'', name, code, role:$('mR').value, active:$('mA').value==='1',
      perms:{ prompts:$('mp_prompts').value, notes:$('mp_notes').value, tasks:$('mp_tasks').value, workflows:$('mp_workflows').value, academy:$('mp_academy').value,
        stages:$('mp_stages').checked, lab:$('mp_lab').checked, export:$('mp_export').checked, api:$('mp_api').checked }
    };
    try {
      const r = await gasPost({ action:'saveMember', code:st.auth.code, member });
      st.members = r.members || [];
      if (id && st.auth.user?.id === id) st.auth.code = code;
      save(); this.closeM(); render(); this.toast('اطلاعات عضو ذخیره شد','ok');
    } catch (e) { this.toast(e.message,'er'); }
  },
  async delMember(id) {
    if (!confirm('این عضو حذف شود؟')) return;
    try { const r = await gasPost({ action:'deleteMember', code:st.auth.code, memberId:id }); st.members=r.members||[]; save(); render(); this.toast('عضو حذف شد','ok'); }
    catch (e) { this.toast(e.message,'er'); }
  },

  /* Global Search */
  gSearch(q) {
    const box = $('gsRes'), s = (q||'').trim().toLowerCase();
    if (!s) { box.classList.remove('open'); return; }
    const res = [];
    if(can('prompts')) live(st.prompts).forEach(p=>{ if((p.title+p.text+(p.tags||[]).join()).toLowerCase().includes(s)) res.push(['پرامپت',p.title,()=>this.jumpP(p.id)]); });
    if(can('notes')) live(st.notes).forEach(n=>{ if((n.title+n.content+n.author).toLowerCase().includes(s)) res.push(['تجربه',n.title,()=>this.jumpN(n.id)]); });
    if(can('tasks')) live(st.tasks).forEach(t=>{ if((t.title+t.assignee+t.statusNote).toLowerCase().includes(s)) res.push(['کار',t.title,()=>this.go('pipeline')]); });
    if(can('workflows')) live(st.workflows).forEach(w=>{ if((w.title+w.description).toLowerCase().includes(s)) res.push(['فرآیند',w.title,()=>this.go('workflows')]); });
    if(can('academy')) live(st.resources).forEach(r=>{ if((r.title+r.summary).toLowerCase().includes(s)) res.push(['منبع',r.title,()=>this.go('academy')]); });
    searchActs = res.slice(0,9);
    box.innerHTML = searchActs.length ? searchActs.map((x,i)=>`<div class="gs-item" onclick="App.runGS(${i})"><span>${esc(x[1])}</span><span class="b b-a">${x[0]}</span></div>`).join('') : `<div class="gs-item" style="color:var(--t3)">نتیجه‌ای یافت نشد</div>`;
    box.classList.add('open');
  },
  runGS(i) { $('gsRes').classList.remove('open'); searchActs[i]?.[2](); },
  jumpP(id) { const p=pById(id); if(p){ flt.pq=p.title; this.go('prompts'); } },
  jumpN(id) { const n=nById(id); if(n){ flt.nq=n.title; this.go('notes'); } },

  /* Prompts + Smart Model Selector inside Prompt Modal */
  mPrompt(id=null, pre=null) {
    const p = id ? pById(id) : null, ls = liveStages();
    const d = p || { title:pre?.title||'', stageId:ls[0]?.id||'', version:'v1.0', provider:'gemini', model:'gemini-2.5-pro', temperature:.3, topP:.9, notes:pre?.notes||'', driveUrl:'', tags:pre?.tags||[], text:pre?.text||'' };
    const provKey = d.provider && st.catalog[d.provider] ? d.provider : 'gemini';
    this.openM(p?'ویرایش پرامپت (نسخه قبلی ذخیره می‌شود)':'ثبت پرامپت جدید', `
      <div class="fg2">
        <div class="fg"><label>عنوان *</label><input id="pT" class="inp" value="${esc(d.title)}" /></div>
        <div class="fg"><label>مرحله</label><select id="pS" class="sel">${ls.map(s=>`<option value="${s.id}" ${d.stageId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
        <div class="fg"><label>موتور هوش مصنوعی</label><select id="pPrv" class="sel" onchange="App.pProvChg(this.value)">${Object.entries(st.catalog).map(([k,v])=>`<option value="${k}" ${provKey===k?'selected':''}>${esc(v.label)}</option>`).join('')}</select></div>
        <div class="fg"><label>مدل</label><select id="pM" class="sel" dir="ltr" onchange="App.pModChg()"></select></div>
      </div>
      <div id="pCustWrap" class="fg" style="display:none"><label>نام مدل سفارشی</label><input id="pMC" class="inp" dir="ltr" value="${esc(d.model||'')}" oninput="App.pModChg()" /></div>
      <div id="pParams"></div>
      <div class="fg2">
        <div class="fg"><label>نسخه</label><input id="pV" class="inp" dir="ltr" value="${esc(p?nextV(p.version):d.version)}" /></div>
        <div class="fg"><label>تگ‌ها</label><input id="pTg" class="inp" value="${esc((d.tags||[]).join(' '))}" /></div>
        <div class="fg"><label>لینک گوگل درایو</label><input id="pDr" class="inp" dir="ltr" value="${esc(d.driveUrl||'')}" /></div>
        <div class="fg"><label>توضیحات و نکات</label><input id="pN" class="inp" value="${esc(d.notes||'')}" /></div>
      </div>
      <div class="fg"><label>متن کامل پرامپت *</label><textarea id="pTx" class="ta" rows="7">${esc(d.text)}</textarea></div>`,
      `<button class="btn" onclick="App.closeM()">انصراف</button><button class="btn btn-p" onclick="App.saveP('${id||''}')">💾 ذخیره پرامپت</button>`, true);
    this._pInitTemp = d.temperature ?? 0.3; this._pInitTopP = d.topP ?? 0.9;
    this.pProvChg(provKey, d.model);
  },
  pProvChg(provKey, selModel=null) {
    const models = st.catalog[provKey]?.models || [];
    const sel = $('pM');

  metaTxt(forApi) {
    const l=st.lab;
    return `نقش: مهندس ارشد پرامپت و ویراستار متون علمی فارسی.\nمأموریت: با مقایسه «خروجی فعلی» و «خروجی مطلوب تیم»، ایرادات «پرامپت فعلی» را استخراج کن و پرامپت اصلاح‌شده را بنویس.\n\n=== ۱. پرامپت فعلی ===\n${l.cur||'—'}\n\n=== ۲. نمونه خروجی مطلوب تیم ===\n${l.ideal||'—'}\n\n=== ۳. خروجی فعلی هوش مصنوعی ===\n${l.ai||'—'}\n${l.hint?`\n=== تمرکز ویژه ===\n${l.hint}\n`:''}\nپاسخ را در ۳ بخش بده:\n۱) تحلیل دقیق تفاوت‌ها و ایرادات\n۲) پرامپت اصلاح‌شده کامل ${forApi?'(دقیقاً بین <<<START>>> و <<<END>>> قرار بده)':'(آماده کپی)'}\n۳) پیشنهاد تنظیمات و نکته برای تست بعدی.`;
  },
  genMeta() { if(!st.lab.cur.trim()) return this.toast('پرامپت فعلی را وارد کنید','wr'); st.lab.meta=this.metaTxt(false); save(); render(); copy(st.lab.meta,'ابر-پرامپت تولید و کپی شد!'); },
  cpMeta() { copy(st.lab.meta,'ابر-پرامپت کپی شد'); },
  async runLab() {
    if(!st.lab.cur.trim()) return this.toast('پرامپت فعلی را وارد کنید','wr');
    const b=$('labBtn'); if(b){b.disabled=true;b.textContent='⏳ در حال تحلیل...';}
    try {
      const r = await this.callAI(this.metaTxt(true), 'کارگاه اصلاح پرامپت');
      st.lab.analysis = r.txt;
      const m = r.txt.match(/<<<START>>>([\s\S]*?)<<<END>>>/);
      st.lab.suggested = m ? m[1].trim() : r.txt.trim();
      (st.lab.iters=st.lab.iters||[]).push({ at:now(), mod:r.mod });
      save(); render(); this.toast(`تحلیل کامل شد (${r.ms}ms | ${r.tot} توکن)`,'ok');
    } catch (e) { this.toast('خطای API: '+e.message,'er'); if(b){b.disabled=false;b.textContent='⚡ تحلیل و پیشنهاد پرامپت جدید';} }
  },
  cpLab() { copy(st.lab.suggested,'پرامپت اصلاح‌شده کپی شد'); },
  labNext() { st.lab.cur=st.lab.suggested; st.lab.ai=''; save(); render(); this.toast('منتقل شد؛ خروجی تست جدید را وارد کنید','in'); },
  labSave() {
    const txt=(st.lab.suggested||'').trim(); if(!txt) return;
    const p=st.lab.pid?st.prompts.find(x=>x.id===st.lab.pid&&!x.deletedAt):null;
    if (p && confirm(`به عنوان نسخه جدید (${nextV(p.version)}) روی «${p.title}» ذخیره شود؟`)) {
      (p.history=p.history||[]).unshift({ version:p.version, savedAt:p.updatedAt||now(), notes:p.notes||'', text:p.text });
      p.text=txt; p.version=nextV(p.version); p.notes='اصلاح‌شده در کارگاه'; p.updatedAt=now();
      save(); scheduleSync(); this.toast('نسخه جدید در خزانه ثبت شد','ok');
    } else this.mPrompt(null,{ title:'پرامپت اصلاح‌شده', text:txt, notes:'ساخته‌شده در کارگاه اصلاح' });
  },

  /* Academy */
  mRes(id=null) {
    const r=id?live(st.resources).find(x=>x.id===id):null, d=r||{ title:'', category:'اصول پرامپت‌نویسی', driveUrl:'', summary:'', linkedPromptIds:[], linkedNoteIds:[] };
    this.openM(r?'ویرایش منبع آموزشی':'ثبت منبع آموزشی', `
      <div class="fg2"><div class="fg"><label>عنوان *</label><input id="rT" class="inp" value="${esc(d.title)}" /></div>
      <div class="fg"><label>دسته</label><select id="rC" class="sel">${['اصول پرامپت‌نویسی','جزوه آموزشی','راهنمای ابزار','استاندارد مرکز'].map(c=>`<option ${d.category===c?'selected':''}>${c}</option>`).join('')}</select></div></div>
      <div class="fg"><label>لینک گوگل درایو</label><input id="rD" class="inp" dir="ltr" value="${esc(d.driveUrl||'')}" /></div>
      <div class="fg"><label>متن و نکات آموزشی *</label><textarea id="rS" class="ta" rows="5">${esc(d.summary)}</textarea></div>
      <div class="fg2">
        <div class="fg"><label>ارجاع به پرامپت‌ها</label><div class="chkbox" style="max-height:110px;overflow:auto">${live(st.prompts).map(p=>`<label class="chk"><input type="checkbox" class="rPC" value="${p.id}" ${(d.linkedPromptIds||[]).includes(p.id)?'checked':''}><span>${esc(p.title)}</span></label>`).join('')}</div></div>
        <div class="fg"><label>ارجاع به تجربیات</label><div class="chkbox" style="max-height:110px;overflow:auto">${live(st.notes).map(n=>`<label class="chk"><input type="checkbox" class="rNC" value="${n.id}" ${(d.linkedNoteIds||[]).includes(n.id)?'checked':''}><span>${esc(n.title)}</span></label>`).join('')}</div></div>
      </div>`,
      `<button class="btn" onclick="App.closeM()">انصراف</button><button class="btn btn-p" onclick="App.saveR('${id||''}')">💾 ذخیره</button>`, true);
  },
  saveR(id) {
    const title=$('rT').value.trim(), summary=$('rS').value.trim(); if(!title||!summary) return this.toast('عنوان و متن الزامی است','er');
    const o={ title, category:$('rC').value, driveUrl:$('rD').value.trim(), summary, linkedPromptIds:[...document.querySelectorAll('.rPC:checked')].map(x=>x.value), linkedNoteIds:[...document.querySelectorAll('.rNC:checked')].map(x=>x.value), updatedAt:now(), deletedAt:'' };
    if(id) Object.assign(st.resources.find(x=>x.id===id), o); else st.resources.unshift({id:uid('r'),...o});
    save(); this.closeM(); render(); scheduleSync(); this.toast('منبع ذخیره شد','ok');
  },
  delR(id) { if(confirm('منبع حذف شود؟')) { const x=st.resources.find(r=>r.id===id); if(x){x.deletedAt=now();x.updatedAt=now();} save(); render(); scheduleSync(); } },

  /* Smart AI Engine & Catalog */
  setProv(p) {
    const c = st.catalog[p] || DEFAULT_PROVIDERS.gemini;
    st.api.provider = p;
    st.api.baseUrl = c.base || '';
    st.api.model = (c.models && c.models[0]) || '';
    st.api.customModel = '';
    save(); render();
  },
  apiSet(k,v,rr) { st.api[k]=v; save(); if(rr) render(); },
  addModelToCat() {
    const m = prompt('نام دقیق مدل جدید را وارد کنید (مثلاً gpt-4.5-preview):');
    if (!m || !m.trim()) return;
    const p = st.api.provider, list = st.catalog[p].models || [];
    if (!list.includes(m.trim())) list.unshift(m.trim());
    st.catalog[p].models = list; st.api.model = m.trim();
    save(); render(); this.toast('مدل به لیست اضافه شد','ok');
  },
  resetCat() { st.catalog = JSON.parse(JSON.stringify(DEFAULT_PROVIDERS)); save(); render(); this.toast('لیست پیش‌فرض مدل‌ها بازگردانی شد','in'); },
  async fetchModels() {
    const a = st.api, key = (a.key||'').trim();
    if (!key) return this.toast('ابتدا کلید API موتور انتخابی را وارد کنید','wr');
    const b = $('fModBtn'); if(b){b.disabled=true;b.textContent='⏳ دریافت...';}
    try {
      let ms = [];
      if (a.provider === 'gemini') {
        const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`), d = await r.json();
        if (!r.ok) throw new Error(d.error?.message || 'HTTP '+r.status);
        ms = (d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,'')).sort((x,y)=>y.localeCompare(x));
      } else {
        const base = (a.baseUrl || st.catalog[a.provider]?.base || '').replace(/\/+$/,'');
        const r = await fetch(`${base}/models`, { headers:{ 'Authorization':'Bearer '+key } }), d = await r.json();
        if (!r.ok) throw new Error(d.error?.message || 'HTTP '+r.status);
        ms = (d.data||[]).map(m=>m.id).filter(Boolean).slice(0,80);
      }
      if (!ms.length) throw new Error('مدلی از سرور دریافت نشد');
      st.catalog[a.provider].models = ms;
      if (!ms.includes(st.api.model)) st.api.model = ms[0];
      save(); render(); this.toast(`${ms.length} مدل به‌روز دریافت و ذخیره شد!`,'ok');
    } catch (e) { this.toast('خطا در دریافت مدل‌ها: '+e.message,'er'); if(b){b.disabled=false;b.textContent='🔄 بروزرسانی زنده لیست مدل‌ها';} }
  },
  async callAI(prompt, pur) {
    const a = st.api, key = (a.key||'').trim(), t0 = performance.now();
    if (!key) throw new Error('کلید API وارد نشده است.');
    const mod = (a.customModel||'').trim() || a.model;
    if (!mod) throw new Error('مدل انتخاب نشده است.');
    const caps = modelCaps(a.provider, mod);

    if (a.provider === 'gemini') {
      const cfg = {};
      if (caps.temp) cfg.temperature = +a.temp || 0.3;
      if (caps.topP) cfg.topP = +a.topP || 0.9;
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(mod)}:generateContent?key=${encodeURIComponent(key)}`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ contents:[{role:'user',parts:[{text:prompt}]}], generationConfig:cfg })
      });
      const d = await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error?.message||'HTTP '+r.status);
      const txt = d.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || '';
      const inT=d.usageMetadata?.promptTokenCount||0, outT=d.usageMetadata?.candidatesTokenCount||0, tot=d.usageMetadata?.totalTokenCount||(inT+outT);
      st.tokenLogs.push({ at:now(), pur, mod, inT, outT, tot }); save();
      return { txt, mod, tot, ms:Math.round(performance.now()-t0) };
    } else {
      const base = (a.baseUrl || st.catalog[a.provider]?.base || 'https://openrouter.ai/api/v1').replace(/\/+$/,'');
      const body = { model:mod, messages:[{role:'user',content:prompt}] };
      if (caps.temp) body.temperature = +a.temp || 0.3;
      if (caps.topP) body.top_p = +a.topP || 0.9;
      const r = await fetch(`${base}/chat/completions`, {
        method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+key}, body:JSON.stringify(body)
      });
      const d = await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error?.message||'HTTP '+r.status);
      const txt = d.choices?.[0]?.message?.content || '';
      const inT=d.usage?.prompt_tokens||0, outT=d.usage?.completion_tokens||0, tot=d.usage?.total_tokens||(inT+outT);
      st.tokenLogs.push({ at:now(), pur, mod, inT, outT, tot }); save();
      return { txt, mod, tot, ms:Math.round(performance.now()-t0) };
    }
  },
  async testApi() {
    const b=$('testBtn'), box=$('testRes'); if(b){b.disabled=true;b.textContent='⏳...';}
    try {
      const r = await this.callAI('فقط کلمه متصل را بنویس.','تست اتصال');
      render();
      const nb=$('testRes'); if(nb) nb.innerHTML=`<span class="dot"></span><b style="color:var(--ok)">متصل شد!</b> مدل: <code>${esc(r.mod)}</code> | ${r.ms}ms`;
      this.toast(`اتصال موفق (${r.ms}ms)`,'ok');
    } catch (e) {
      if(box) box.innerHTML=`<span class="dot e"></span><b style="color:var(--er)">خطا:</b> ${esc(e.message)}`;
      if(b){b.disabled=false;b.textContent='📡 تست اتصال زنده';}
      this.toast('خطا: '+e.message,'er');
    }
  },
  clrTok() { if(confirm('تاریخچه توکن پاک شود؟')) { st.tokenLogs=[]; save(); render(); } },

  /* Backup, Docs & Sample Data */
  expJson() {
    const payload = { exportedAt:now(), stages:st.stages, prompts:st.prompts, notes:st.notes, tasks:st.tasks, workflows:st.workflows, resources:st.resources };
    dl(`ai-backup-${now().slice(0,10)}.json`, JSON.stringify(payload,null,2), 'application/json;charset=utf-8');
    this.toast('بکاپ کامل JSON دانلود شد','ok');
  },
  expDoc(fmt, sc='all') {
    const d=now().slice(0,10), iP=sc==='all'||sc==='prompts', iN=sc==='all'||sc==='notes', iW=sc==='all'||sc==='workflows';
    const ps=live(st.prompts), ns=live(st.notes), ws=live(st.workflows);
    if (fmt==='md') {
      let m=`# مستندات اتاق فرمان هوش مصنوعی (${fDT(now())})\n\n`;
      if(iP){ m+=`## پرامپت‌ها\n`; ps.forEach((p,i)=>m+=`### ${i+1}. ${p.title} (${p.version})\nمرحله: ${sName(p.stageId)} | مدل: ${p.model||'—'}\n\`\`\`\n${p.text}\n\`\`\`\n\n`); }
      if(iN){ m+=`## تجربیات\n`; ns.forEach((n,i)=>m+=`### ${i+1}. ${n.title}\nنویسنده: ${n.author} | ${fDate(n.date)}\n\n${n.content}\n\n`); }
      if(iW){ m+=`## فرآیندها\n`; ws.forEach((w,i)=>{ m+=`### ${i+1}. ${w.title}\n`; (w.steps||[]).forEach((s,j)=>m+=`${j+1}. ${sName(s.stageId)} ${s.note?'— '+s.note:''}\n`); m+='\n'; }); }
      dl(`docs-${sc}-${d}.md`,'\uFEFF'+m,'text/markdown;charset=utf-8');
    } else {
      let b=`<h1>مستندات اتاق فرمان هوش مصنوعی</h1><p>تاریخ: ${fDT(now())}</p>`;
      if(iP){ b+=`<h2>خزانه پرامپت‌ها</h2>`; ps.forEach((p,i)=>b+=`<h3>${i+1}. ${esc(p.title)} (${esc(p.version)})</h3><p>مرحله: ${esc(sName(p.stageId))} | مدل: ${esc(p.model||'—')}</p><div class="bx">${esc(p.text).replace(/\n/g,'<br>')}</div>`); }
      if(iN){ b+=`<h2>دفترچه تجربیات</h2>`; ns.forEach((n,i)=>b+=`<h3>${i+1}. ${esc(n.title)}</h3><p>${esc(n.author)} | ${fDate(n.date)}</p><p>${esc(n.content).replace(/\n/g,'<br>')}</p><hr>`); }
      if(iW){ b+=`<h2>فرآیندهای کاری</h2>`; ws.forEach((w,i)=>{ b+=`<h3>${i+1}. ${esc(w.title)}</h3><ol>${(w.steps||[]).map(s=>`<li><b>${esc(sName(s.stageId))}</b> ${esc(s.note||'')}</li>`).join('')}</ol>`; }); }
      const html=`\uFEFF<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" lang="fa" dir="rtl"><head><meta charset="utf-8"><style>body{font-family:Vazirmatn,'B Nazanin',Tahoma,sans-serif;direction:rtl;text-align:right;line-height:1.8}h1,h2{color:#312e81}.bx{background:#f8fafc;border:1px solid #cbd5e1;padding:10px;margin:8px 0}</style></head><body>${b}</body></html>`;
      dl(`docs-${sc}-${d}.doc`,html,'application/msword;charset=utf-8');
    }
    this.toast('فایل مستندات دانلود شد','ok');
  },
  loadSample() {
    const t=now();
    if (!live(st.prompts).some(x=>x.id==='smp_p1')) st.prompts.push({ id:'smp_p1', title:'نمونه: پیاده‌سازی دقیق صوت علمی', stageId:liveStages()[0]?.id||'s1', version:'v1.0', provider:'gemini', model:'gemini-2.5-flash', temperature:0.1, topP:0.85, notes:'مناسب صوت‌های زیر ۴۵ دقیقه', driveUrl:'', tags:['#نمونه','#صوت_به_متن'], text:'فایل صوتی پیوست را کلمه‌به‌کلمه با حفظ اصطلاحات تخصصی به فارسی معیار پیاده کن.', history:[], author:'نمونه', updatedAt:t, deletedAt:'' });
    if (!live(st.notes).some(x=>x.id==='smp_n1')) st.notes.push({ id:'smp_n1', title:'نمونه: برش فایل‌های صوتی بالای یک ساعت', author:'نمونه', date:t.slice(0,10), tags:['#نمونه'], stageId:'', promptId:'', content:'فایل‌های طولانی را به بخش‌های ۲۵ دقیقه‌ای تقسیم کنید تا کیفیت خروجی افت نکند.', updatedAt:t, deletedAt:'' });
    save(); render(); scheduleSync(); this.toast('نمونه‌های آموزشی اضافه شدند','in');
  },
  clearSample() {
    if (!confirm('موارد نمونه پاک شوند؟')) return;
    const t=now();
    ['prompts','notes','tasks','workflows','resources'].forEach(k=>st[k].forEach(x=>{ if(String(x.id).startsWith('smp_')){x.deletedAt=t;x.updatedAt=t;} }));
    save(); render(); scheduleSync(); this.toast('موارد نمونه پاک شدند','ok');
  }
};

document.addEventListener('DOMContentLoaded', () => App.init());
})();
</script>
</body>
